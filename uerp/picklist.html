// STATE

let picklistRows = [];

// =========================================================

document.addEventListener('DOMContentLoaded', () => {

function initApp() {

    const today = new Date();

    const localDate =
        new Date(
            today.getTime() -
            today.getTimezoneOffset() * 60000
        )
        .toISOString()
        .split('T')[0];

    document.getElementById('pickDate').value =
        localDate;

    currentPickDate = localDate;

    document
        .getElementById('pickDate')
        .addEventListener('change', () => {

            currentPickDate =
                document.getElementById('pickDate').value;

            selectedIds.clear();

            loadPicklist();

        });


    document
        .getElementById('searchInput')
        .addEventListener('input', renderTable);


    document
        .getElementById('addSearchInput')
        .addEventListener(
            'input',
            debounce(searchTransactions, 350)
        );


    loadPicklist();

}


// =========================================================
// HEADER
// =========================================================

async function loadHeader() {

    try {

        const res =
            await fetch('uerpheader.html');

        if (!res.ok)
            throw new Error('Header load failed');

        const html =
            await res.text();

        const container =
            document.getElementById('headerContainer');

        container.innerHTML = html;


        const pickTab =
            container.querySelector(
                '[data-page="picklist"]'
            );

        if (pickTab) {

            pickTab.classList.add(
                'chrome-tab-active'
            );

        }


        if (
            typeof window.initUerpLayout ===
            'function'
        ) {

            window.__uerpLayoutInitialized =
                false;

            window.initUerpLayout();

        }

    } catch (err) {

        console.warn(
            'Cannot load header dynamically:',
            err
        );

    }

}


// =========================================================
// LOAD PICKLIST
// =========================================================

async function loadPicklist() {

    setLoading(true, 'กำลังโหลด Picklist...');

    try {

        const { data, error } =
            await supabaseClient

                .from('picklist')

                .select(`
                    invoice_item_id,
                    pick_date,
                    pick_status,
                    created_at,
                    updated_at
                `)

                .eq(
                    'pick_date',
                    currentPickDate
                )

                .order(
                    'created_at',
                    { ascending: true }
                );


        if (error)
            throw error;


        if (!data || data.length === 0) {

            picklistRows = [];

            aggregatedRows = [];

            renderTable();

            updateSummary();

            setLoading(false);

            updateLog(
                'ยังไม่มี Picklist สำหรับวันนี้'
            );

            return;

        }


        const ids =
            data.map(
                x => x.invoice_item_id
            );


        /*
         * ดึง transaction ที่เกี่ยวข้อง
         */
        const { data: transactions, error: txError } =
            await supabaseClient

                .from('transactions')

                .select(`
                    invoice_item_id,
                    item_code,
                    item_name,
                    qty
                `)

                .in(
                    'invoice_item_id',
                    ids
                );


        if (txError)
            throw txError;


        const txMap = {};

        (transactions || []).forEach(row => {

            txMap[row.invoice_item_id] =
                row;

        });


        picklistRows =
            data.map(row => ({

                ...row,

                item_code:
                    txMap[row.invoice_item_id]
                        ?.item_code || '',

                item_name:
                    txMap[row.invoice_item_id]
                        ?.item_name || '',

                qty:
                    Number(
                        txMap[row.invoice_item_id]
                            ?.qty || 0
                    )

            }));


        aggregatePicklist();

        renderTable();

        updateSummary();

        setLoading(false);

        updateLog(
            `โหลด ${picklistRows.length.toLocaleString()} รายการ`
        );


    } catch (err) {

        console.error(err);

        showError(
            `โหลด Picklist ไม่สำเร็จ: ${err.message}`
        );

        setLoading(false);

    }

}


// =========================================================
// CREATE PICKLIST FROM TRANSACTIONS
// =========================================================

async function createPicklistFromTransactions() {

    if (!currentPickDate) {

        alert('กรุณาเลือกวันที่');

        return;

    }


    if (
        !confirm(
            `ต้องการสร้าง Picklist สำหรับวันที่ ${formatThaiDate(currentPickDate)} หรือไม่?`
        )
    ) {

        return;

    }


    setLoading(
        true,
        'กำลังตรวจสอบ Transactions...'
    );


    try {

        /*
         * ดึง transactions ตาม Created Date
         *
         * date เป็น timestamp
         * ใช้ >= วันเริ่มต้น
         * และ < วันถัดไป
         */

        const start =
            `${currentPickDate}T00:00:00+07:00`;

        const nextDate =
            getNextDate(currentPickDate);

        const end =
            `${nextDate}T00:00:00+07:00`;


        let allTransactions = [];

        let from = 0;

        const pageSize = 1000;

        while (true) {

            const { data, error } =
                await supabaseClient

                    .from('transactions')

                    .select(`
                        invoice_item_id,
                        item_code,
                        item_name,
                        qty,
                        date,
                        status,
                        tracking_number,
                        order_no
                    `)

                    .gte('date', start)

                    .lt('date', end)

                    /*
                     * เบื้องต้นใช้ pending
                     */
                    .eq('status', 'pending')

                    .range(
                        from,
                        from + pageSize - 1
                    );


            if (error)
                throw error;


            if (!data || data.length === 0)
                break;


            allTransactions =
                allTransactions.concat(data);


            if (data.length < pageSize)
                break;


            from += pageSize;

        }


        if (allTransactions.length === 0) {

            setLoading(false);

            alert(
                'ไม่พบ Transactions ที่เข้าเงื่อนไขสำหรับวันนี้'
            );

            return;

        }


        /*
         * เอาเฉพาะ invoice_item_id ที่ไม่ซ้ำ
         */

        const uniqueMap = new Map();


        allTransactions.forEach(row => {

            if (
                row.invoice_item_id &&
                !uniqueMap.has(row.invoice_item_id)
            ) {

                uniqueMap.set(
                    row.invoice_item_id,
                    row
                );

            }

        });


        const uniqueRows =
            Array.from(uniqueMap.values());


        /*
         * ตรวจรายการที่มีอยู่แล้วใน picklist
         */

        const ids =
            uniqueRows.map(
                x => x.invoice_item_id
            );


        let existingIds = new Set();


        for (
            let i = 0;
            i < ids.length;
            i += 1000
        ) {

            const chunk =
                ids.slice(i, i + 1000);


            const { data: existing, error } =
                await supabaseClient

                    .from('picklist')

                    .select('invoice_item_id')

                    .in(
                        'invoice_item_id',
                        chunk
                    );


            if (error)
                throw error;


            (existing || []).forEach(row => {

                existingIds.add(
                    row.invoice_item_id
                );

            });

        }


        /*
         * สร้างเฉพาะรายการใหม่
         */

        const newRows =
            uniqueRows

                .filter(
                    row =>
                        !existingIds.has(
                            row.invoice_item_id
                        )
                )

                .map(row => ({

                    invoice_item_id:
                        row.invoice_item_id,

                    pick_date:
                        currentPickDate,

                    pick_status:
                        'waiting'

                }));


        if (newRows.length === 0) {

            setLoading(false);

            alert(
                'ไม่มีรายการใหม่ รายการทั้งหมดถูกเพิ่มเข้า Picklist แล้ว'
            );

            await loadPicklist();

            return;

        }


        /*
         * Insert แบบ batch
         */

        const { error: insertError } =
            await supabaseClient

                .from('picklist')

                .insert(newRows);


        if (insertError)
            throw insertError;


        setLoading(
            true,
            `เพิ่ม ${newRows.length.toLocaleString()} รายการ...`
        );


        await loadPicklist();


        alert(
            `สร้าง Picklist สำเร็จ\nเพิ่ม ${newRows.length.toLocaleString()} รายการ`
        );


    } catch (err) {

        console.error(err);

        setLoading(false);

        showError(
            `สร้าง Picklist ไม่สำเร็จ: ${err.message}`
        );

    }

}


// =========================================================
// AGGREGATE
// =========================================================

function aggregatePicklist() {

    const map = {};


    picklistRows.forEach(row => {

        const code =
            row.item_code || 'UNSPECIFIED';

        const name =
            row.item_name || 'ไม่ระบุชื่อสินค้า';

        const key =
            `${code}___${name}`;


        if (!map[key]) {

            map[key] = {

                key,

                item_code:
                    code,

                item_name:
                    name,

                qty:
                    0,

                waitingQty:
                    0,

                pickedQty:
                    0,

                rows: []

            };

        }


        const qty =
            Number(row.qty || 0);


        map[key].qty += qty;


        if (
            row.pick_status ===
            'waiting'
        ) {

            map[key].waitingQty += qty;

        } else {

            map[key].pickedQty += qty;

        }


        map[key].rows.push(row);

    });


    aggregatedRows =
        Object.values(map);

}


// =========================================================
// RENDER
// =========================================================

function renderTable() {

    aggregatePicklist();


    const body =
        document.getElementById('tableBody');


    const searchTerm =
        document
            .getElementById('searchInput')
            .value
            .toLowerCase()
            .trim();


    let rows =
        aggregatedRows;


    if (searchTerm) {

        rows =
            rows.filter(row =>

                row.item_code
                    .toLowerCase()
                    .includes(searchTerm)

                ||

                row.item_name
                    .toLowerCase()
                    .includes(searchTerm)

            );

    }


    if (rows.length === 0) {

        body.innerHTML = `

            <tr>

                <td colspan="5"
                    class="p-10 text-center text-slate-400">

                    <i class="fa-solid fa-box-open text-2xl mb-2"></i>

                    <div>
                        ยังไม่มีรายการ Pick
                    </div>

                </td>

            </tr>

        `;

        updateSelectedCount();

        return;

    }


    let html = '';


    rows.forEach(row => {

        /*
         * ถ้า SKU มีทั้ง waiting และ picked
         * ให้ checkbox เลือกเฉพาะ waiting
         */

        const waitingRows =
            row.rows.filter(
                r =>
                    r.pick_status === 'waiting'
            );


        const waitingIds =
            waitingRows.map(
                r =>
                    r.invoice_item_id
            );


        const selectedWaiting =
            waitingIds.filter(
                id =>
                    selectedIds.has(id)
            );


        const allWaitingSelected =
            waitingIds.length > 0 &&
            selectedWaiting.length ===
            waitingIds.length;


        const statusHtml =
            row.waitingQty > 0

                ? `
                    <span class="inline-flex items-center gap-1
                                 bg-amber-50 text-amber-700
                                 border border-amber-200
                                 px-2 py-1 rounded-full
                                 text-[10px] font-bold">

                        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>

                        WAITING

                    </span>
                  `

                : `
                    <span class="inline-flex items-center gap-1
                                 bg-emerald-50 text-emerald-700
                                 border border-emerald-200
                                 px-2 py-1 rounded-full
                                 text-[10px] font-bold">

                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>

                        PICKED

                    </span>
                  `;


        html += `

            <tr class="
                hover:bg-slate-50
                transition-colors
                border-b border-slate-100
            ">

                <td class="p-3 text-center">

                    ${
                        waitingIds.length > 0

                        ? `

                            <input
                                type="checkbox"
                                class="sku-checkbox
                                       w-4 h-4
                                       accent-blue-600
                                       cursor-pointer"
                                data-ids='${JSON.stringify(waitingIds)}'
                                ${allWaitingSelected ? 'checked' : ''}
                                onchange="toggleSkuSelection(this)"
                            >

                          `

                        : `

                            <span class="text-emerald-500">
                                <i class="fa-solid fa-check"></i>
                            </span>

                          `
                    }

                </td>


                <td class="p-3 font-mono
                           text-[11px] text-slate-500">

                    ${escapeHtml(row.item_code)}

                </td>


                <td class="p-3 font-semibold
                           text-slate-800">

                    ${escapeHtml(row.item_name)}

                </td>


                <td class="p-3 text-right
                           font-bold text-slate-700">

                    ${row.qty.toLocaleString()}

                </td>


                <td class="p-3 text-center">

                    ${statusHtml}

                </td>

            </tr>

        `;

    });


    body.innerHTML = html;


    updateSelectedCount();

}


// =========================================================
// CHECKBOX
// =========================================================

function toggleSkuSelection(checkbox) {

    const ids =
        JSON.parse(
            checkbox.dataset.ids
        );


    ids.forEach(id => {

        if (checkbox.checked) {

            selectedIds.add(id);

        } else {

            selectedIds.delete(id);

        }

    });


    updateSelectedCount();

}


function toggleMasterCheckbox(checkbox) {

    if (checkbox.checked) {

        selectAllWaiting();

    } else {

        clearSelection();

    }

}


function selectAllWaiting() {

    picklistRows.forEach(row => {

        if (
            row.pick_status ===
            'waiting'
        ) {

            selectedIds.add(
                row.invoice_item_id
            );

        }

    });


    renderTable();

}


function clearSelection() {

    selectedIds.clear();

    renderTable();

}


// =========================================================
// SUBMIT PICK
// =========================================================

async function submitPicked() {

    const ids =
        Array.from(selectedIds);


    if (ids.length === 0) {

        alert(
            'กรุณาเลือกรายการที่ต้องการ Pick'
        );

        return;

    }


    const confirmed =
        confirm(
            `ยืนยัน Pick จำนวน ${ids.length.toLocaleString()} รายการหรือไม่?`
        );


    if (!confirmed)
        return;


    setLoading(
        true,
        `กำลังบันทึก ${ids.length.toLocaleString()} รายการ...`
    );


    try {

        /*
         * Batch Update
         */

        const { error } =
            await supabaseClient

                .from('picklist')

                .update({

                    pick_status:
                        'picked',

                    updated_at:
                        new Date().toISOString()

                })

                .in(
                    'invoice_item_id',
                    ids
                )

                .eq(
                    'pick_status',
                    'waiting'
                );


        if (error)
            throw error;


        selectedIds.clear();


        await loadPicklist();


        alert(
            `Pick สำเร็จ ${ids.length.toLocaleString()} รายการ`
        );


    } catch (err) {

        console.error(err);

        setLoading(false);

        showError(
            `บันทึก Pick ไม่สำเร็จ: ${err.message}`
        );

    }

}


// =========================================================
// ADD ITEM MODAL
// =========================================================

function openAddModal() {

    const modal =
        document.getElementById('addModal');


    modal.classList.remove('hidden');

    modal.classList.add('flex');


    document.getElementById(
        'addSearchInput'
    ).value = '';


    document.getElementById(
        'addSearchResults'
    ).innerHTML = `

        <div class="p-8 text-center
                    text-slate-400 text-xs">

            พิมพ์คำค้นหาเพื่อค้นหารายการ

        </div>

    `;


    setTimeout(() => {

        document
            .getElementById(
                'addSearchInput'
            )
            .focus();

    }, 100);

}


function closeAddModal() {

    const modal =
        document.getElementById('addModal');


    modal.classList.add('hidden');

    modal.classList.remove('flex');

}


// =========================================================
// SEARCH TRANSACTIONS
// =========================================================

async function searchTransactions() {

    const input =
        document.getElementById(
            'addSearchInput'
        );


    const term =
        input.value.trim();


    const container =
        document.getElementById(
            'addSearchResults'
        );


    if (term.length < 2) {

        container.innerHTML = `

            <div class="p-8 text-center
                        text-slate-400 text-xs">

                พิมพ์อย่างน้อย 2 ตัวอักษร

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="p-8 text-center
                    text-slate-400 text-xs">

            <i class="fa-solid fa-circle-notch animate-spin mr-1"></i>

            กำลังค้นหา...

        </div>

    `;


    try {

        /*
         * ค้นหา 3 field
         */

        const { data, error } =
            await supabaseClient

                .from('transactions')

                .select(`
                    invoice_item_id,
                    order_no,
                    item_code,
                    item_name,
                    qty,
                    date,
                    status
                `)

                .or(
                    `invoice_item_id.ilike.%${escapeQuery(term)}%,
                     order_no.ilike.%${escapeQuery(term)}%,
                     item_code.ilike.%${escapeQuery(term)}%`
                )

                .order(
                    'date',
                    { ascending: false }
                )

                .limit(50);


        if (error)
            throw error;


        if (!data || data.length === 0) {

            container.innerHTML = `

                <div class="p-8 text-center
                            text-slate-400 text-xs">

                    ไม่พบรายการ

                </div>

            `;

            return;

        }


        renderSearchResults(data);


    } catch (err) {

        console.error(err);

        container.innerHTML = `

            <div class="p-6 text-center
                        text-red-500 text-xs">

                ค้นหาไม่สำเร็จ:
                ${escapeHtml(err.message)}

            </div>

        `;

    }

}


// =========================================================
// RENDER SEARCH RESULT
// =========================================================

function renderSearchResults(data) {

    const container =
        document.getElementById(
            'addSearchResults'
        );


    let html = '';


    data.forEach(row => {

        html += `

            <div class="
                p-3 border-b border-slate-100
                hover:bg-slate-50
                flex items-center
                justify-between gap-3
            ">

                <div class="min-w-0">

                    <div class="flex items-center gap-2">

                        <span class="
                            font-mono
                            text-[10px]
                            text-slate-500
                        ">
                            ${escapeHtml(row.item_code)}
                        </span>

                        <span class="
                            text-[10px]
                            text-slate-400
                        ">
                            ${escapeHtml(row.order_no || '-')}
                        </span>

                    </div>


                    <div class="
                        text-xs font-semibold
                        text-slate-800
                        truncate
                    ">

                        ${escapeHtml(row.item_name)}

                    </div>


                    <div class="
                        text-[10px]
                        text-slate-400
                        mt-0.5
                    ">

                        Qty ${Number(row.qty || 0).toLocaleString()}
                        · ${formatDateTime(row.date)}

                    </div>

                </div>


                <button
                    onclick="addTransactionToPicklist('${escapeJs(row.invoice_item_id)}')"
                    class="
                        shrink-0
                        bg-blue-50
                        hover:bg-blue-100
                        text-blue-600
                        border border-blue-100
                        px-3 py-1.5
                        rounded-lg
                        text-[10px]
                        font-bold
                    "
                >

                    <i class="fa-solid fa-plus mr-1"></i>
                    เพิ่ม

                </button>

            </div>

        `;

    });


    container.innerHTML = html;

}


// =========================================================
// ADD SINGLE TRANSACTION
// =========================================================

async function addTransactionToPicklist(
    invoiceItemId
) {

    try {

        setLoading(
            true,
            'กำลังเพิ่มรายการ...'
        );


        const { error } =
            await supabaseClient

                .from('picklist')

                .insert({

                    invoice_item_id:
                        invoiceItemId,

                    pick_date:
                        currentPickDate,

                    pick_status:
                        'waiting'

                });


        if (error) {

            /*
             * duplicate PK
             */

            if (
                error.code === '23505'
            ) {

                alert(
                    'รายการนี้มีอยู่ใน Picklist แล้ว'
                );

            } else {

                throw error;

            }

        } else {

            alert(
                'เพิ่มรายการเข้า Picklist แล้ว'
            );

        }


        await loadPicklist();


        setLoading(false);


    } catch (err) {

        console.error(err);

        setLoading(false);

        showError(
            `เพิ่มรายการไม่สำเร็จ: ${err.message}`
        );

    }

}


// =========================================================
// SUMMARY
// =========================================================

function updateSummary() {

    let skuCount =
        aggregatedRows.length;

    let totalQty = 0;

    let waitingQty = 0;

    let pickedQty = 0;


    aggregatedRows.forEach(row => {

        totalQty += row.qty;

        waitingQty +=
            row.waitingQty;

        pickedQty +=
            row.pickedQty;

    });


    document.getElementById(
        'summarySku'
    ).innerText =
        skuCount.toLocaleString();


    document.getElementById(
        'summaryQty'
    ).innerText =
        totalQty.toLocaleString();


    document.getElementById(
        'summaryWaiting'
    ).innerText =
        waitingQty.toLocaleString();


    document.getElementById(
        'summaryPicked'
    ).innerText =
        pickedQty.toLocaleString();

}


// =========================================================
// SELECT COUNT
// =========================================================

function updateSelectedCount() {

    const count =
        selectedIds.size;


    document.getElementById(
        'selectedCount'
    ).innerText =
        `เลือกแล้ว ${count.toLocaleString()} รายการ`;


    const button =
        document.getElementById(
            'submitButton'
        );


    button.disabled =
        count === 0;


    const master =
        document.getElementById(
            'masterCheckbox'
        );


    if (master) {

        const waitingCount =
            picklistRows.filter(
                row =>
                    row.pick_status ===
                    'waiting'
            ).length;


        master.checked =
            waitingCount > 0 &&
            count === waitingCount;

    }

}


// =========================================================
// LOADING
// =========================================================

function setLoading(
    loading,
    message = 'กำลังดำเนินการ...'
) {

    const indicator =
        document.getElementById(
            'statusIndicator'
        );


    const refreshIcon =
        document.getElementById(
            'refreshIcon'
        );


    const statusText =
        document.getElementById(
            'statusText'
        );


    if (loading) {

        indicator.classList.remove(
            'hidden'
        );

        indicator.classList.add(
            'flex'
        );

        statusText.innerText =
            message;


        refreshIcon.classList.add(
            'fa-spin'
        );

    } else {

        indicator.classList.add(
            'hidden'
        );

        indicator.classList.remove(
            'flex'
        );

        refreshIcon.classList.remove(
            'fa-spin'
        );

    }

}


// =========================================================
// LOGGER
// =========================================================

function updateLog(message) {

    console.log(
        `[Picklist] ${message}`
    );

}


// =========================================================
// ERROR
// =========================================================

function showError(message) {

    alert(message);

}


// =========================================================
// DATE
// =========================================================

function getNextDate(dateString) {

    const d =
        new Date(
            `${dateString}T00:00:00`
        );


    d.setDate(
        d.getDate() + 1
    );


    return d
        .toISOString()
        .split('T')[0];

}


function formatThaiDate(dateString) {

    if (!dateString)
        return '-';


    const d =
        new Date(
            `${dateString}T00:00:00`
        );


    return d.toLocaleDateString(
        'th-TH',
        {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        }
    );

}


function formatDateTime(value) {

    if (!value)
        return '-';


    const d =
        new Date(value);


    return d.toLocaleString(
        'th-TH',
        {
            day: '2-digit',
            month: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        }
    );

}


// =========================================================
// UTILITIES
// =========================================================

function escapeHtml(text) {

    const div =
        document.createElement('div');

    div.innerText =
        text || '';

    return div.innerHTML;

}


function escapeJs(text) {

    return String(text || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '\\r');

}


function escapeQuery(text) {

    return String(text || '')
        .replace(/[%_,]/g, '\\$&');

}


function debounce(
    fn,
    delay
) {

    let timer;

    return function () {

        clearTimeout(timer);

        timer =
            setTimeout(
                () => fn.apply(this, arguments),
                delay
            );

    };

}
