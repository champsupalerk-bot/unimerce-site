<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-100 text-slate-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UERP - Order Management | Unimerce Co., Ltd.</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'google-blue': '#1a73e8',
                        'google-blueHover': '#1557b0',
                        'google-red': '#d93025',
                        'google-gray': '#5f6368',
                        'google-border': '#dadce0',
                        'shopee': '#ee4d2d',
                        'lazada': '#0f146d',
                        'tiktok': '#000000'
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { 
            font-family: 'Inter', 'Noto Sans Thai', system-ui, -apple-system, sans-serif; 
            touch-action: manipulation;
        }
        .google-card {
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 10px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.05);
        }
        .google-select {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%235f6368' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 4px center;
            background-size: 14px;
        }
        /* Mobile Safe Font Size (16px) to prevent iOS auto-zoom */
        .input-mobile-safe {
            font-size: 16px !important;
        }
        @media (min-width: 640px) {
            .input-mobile-safe {
                font-size: 0.75rem !important; /* 12px on desktop */
            }
        }
        /* Row Selection Styles */
        .row-selected {
            background-color: #e8f0fe !important;
        }
        .row-duplicate {
            background-color: #fff7ed !important;
        }
        .row-selected.row-duplicate {
            background-color: #fef08a !important;
        }
        th.sortable { 
            cursor: pointer; 
            user-select: none; 
        }
        th.sortable:hover { 
            background-color: #f1f5f9; 
        }
        
        /* Minimal Circular Checkbox */
        .rounded-checkbox {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1.5px solid #94a3b8;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .rounded-checkbox:checked {
            background-color: #1a73e8;
            border-color: #1a73e8;
        }
        .rounded-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 2.5px;
            left: 2.5px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
        }

        /* Sticky Table Header */
        .sticky-table-container {
            max-height: calc(100vh - 230px);
            overflow-y: auto;
        }
        .sticky-table-container thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-100">

    <!-- Dynamic Navigation Header Container -->
    <div id="headerContainer"></div>

    <main class="max-w-[1400px] mx-auto px-2 sm:px-4 py-2 sm:py-4 w-full flex-grow space-y-2">

        <!-- Top Action Bar -->
        <div class="flex items-center justify-between gap-2">
            <h1 class="text-sm sm:text-lg font-bold text-slate-900 flex items-center gap-1.5">
                <i class="fa-solid fa-boxes-packing text-google-blue"></i>
                <span class="hidden sm:inline">รายการจัดการคำสั่งซื้อ (Order Management)</span>
                <span class="sm:hidden">Order Management</span>
            </h1>
            <div class="flex items-center gap-1.5">
                <button id="submitBtn" onclick="submitChanges()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-md shadow-sm flex items-center gap-1 transition disabled:opacity-40">
                    <i class="fa-solid fa-floppy-disk text-[11px]"></i> <span>บันทึก</span> (<span id="pendingChangesCount">0</span>)
                </button>
                <button onclick="forceRefreshData()" class="px-2.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-md transition" title="โหลดข้อมูลใหม่">
                    <i id="refreshIcon" class="fa-solid fa-rotate-right text-[11px]"></i>
                </button>
            </div>
        </div>

        <!-- Filters Control Toolbar -->
        <div class="google-card p-2 bg-white space-y-1.5">
            <!-- Row 1: Compact Dropdowns in One Line (Mobile & Desktop) -->
            <div class="grid grid-cols-3 gap-1.5">
                <div class="relative">
                    <select id="periodFilter" onchange="handlePeriodChange()" class="w-full google-select bg-slate-50 border border-google-border rounded-md pl-2 pr-5 py-1 text-slate-700 font-medium focus:outline-none focus:border-google-blue input-mobile-safe">
                        <option value="ALL">ช่วงเวลา: ทั้งหมด</option>
                        <option value="TODAY" selected>ช่วงเวลา: วันนี้</option>
                        <option value="YESTERDAY">ช่วงเวลา: เมื่อวาน</option>
                        <option value="THIS_WEEK">ช่วงเวลา: สัปดาห์นี้</option>
                        <option value="THIS_MONTH">ช่วงเวลา: เดือนนี้</option>
                        <option value="LAST_MONTH">ช่วงเวลา: เดือนที่แล้ว</option>
                        <option value="THIS_YEAR">ช่วงเวลา: ปีนี้</option>
                        <option value="CUSTOM">ช่วงเวลา: กำหนดเอง</option>
                    </select>
                </div>

                <div class="relative">
                    <select id="channelFilter" onchange="applyFilters()" class="w-full google-select bg-slate-50 border border-google-border rounded-md pl-2 pr-5 py-1 text-slate-700 font-medium focus:outline-none focus:border-google-blue input-mobile-safe">
                        <option value="ALL" selected>ช่องทาง: ทั้งหมด</option>
                        <option value="Shopee">Shopee</option>
                        <option value="Lazada">Lazada</option>
                        <option value="TikTok">TikTok</option>
                    </select>
                </div>

                <div class="relative">
                    <select id="statusFilter" onchange="applyFilters()" class="w-full google-select bg-slate-50 border border-google-border rounded-md pl-2 pr-5 py-1 text-slate-700 font-medium focus:outline-none focus:border-google-blue input-mobile-safe">
                        <option value="ALL" selected>สถานะ: ทั้งหมด</option>
                        <option value="PENDING">PENDING</option>
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="VOID">VOID</option>
                    </select>
                </div>
            </div>

            <!-- Custom Date Range Inputs (Hidden by default) -->
            <div id="customDateContainer" class="hidden flex items-center justify-end gap-1.5 pt-1 text-xs text-slate-600">
                <input type="date" id="startDate" onchange="applyFilters()" class="border border-google-border rounded px-1.5 py-0.5 input-mobile-safe">
                <span>-</span>
                <input type="date" id="endDate" onchange="applyFilters()" class="border border-google-border rounded px-1.5 py-0.5 input-mobile-safe">
            </div>

            <!-- Row 2: Searchbar -->
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ค้นหา Invoice, Order No, Customer, Item Code..." class="w-full pl-7 pr-2.5 py-1 border border-google-border rounded-md focus:outline-none focus:border-google-blue input-mobile-safe">
            </div>

            <!-- Row 3: Sub-bar with Execution Log (Left) & Show PK Checkbox (Right) -->
            <div class="flex items-center justify-between text-[11px] text-slate-500 pt-0.5">
                <div id="executionLog" class="truncate font-mono text-[10px] text-slate-500">
                    <i class="fa-solid fa-database text-google-blue"></i> โหลดข้อมูล...
                </div>

                <label class="flex items-center gap-1 font-medium cursor-pointer select-none text-slate-700 shrink-0">
                    <input type="checkbox" id="showPKToggle" onchange="applyFilters()" class="rounded-checkbox">
                    <span>show PK (<span id="selectedCountText" class="font-bold text-google-blue">0</span>)</span>
                </label>
            </div>
        </div>

        <!-- Status Indicator Panel -->
        <div id="statusIndicator" class="hidden p-2 bg-blue-50 rounded-md border border-blue-100 text-xs text-google-blue">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-notch animate-spin text-xs"></i>
                <span id="statusText" class="font-medium text-[11px]">กำลังโหลดข้อมูล...</span>
            </div>
        </div>

        <!-- Main Fixed Height Table Container -->
        <section class="google-card bg-white overflow-hidden">
            <div class="w-full sticky-table-container">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-600 font-bold text-[11px] border-b border-google-border uppercase tracking-tight">
                            <th class="p-2 w-20 text-center sortable" onclick="sortTable('date')">
                                date <span id="sort_date" class="ml-0.5 text-slate-300"><i class="fa-solid fa-arrow-down-wide-short"></i></span>
                            </th>
                            <th class="p-2 w-28 text-center sortable" onclick="sortTable('invoice_no')">
                                invoice_no / order <span id="sort_invoice_no" class="ml-0.5 text-slate-300"><i class="fa-solid fa-arrow-down-wide-short"></i></span>
                            </th>
                            <th class="p-2 w-24 text-center sortable" onclick="sortTable('item_code')">
                                item_code <span id="sort_item_code" class="ml-0.5 text-slate-300"><i class="fa-solid fa-arrow-down-wide-short"></i></span>
                            </th>
                            <th class="p-2 text-center sortable" onclick="sortTable('item_name')">
                                item_name <span id="sort_item_name" class="ml-0.5 text-slate-300"><i class="fa-solid fa-arrow-down-wide-short"></i></span>
                            </th>
                            <th class="p-2 w-20 text-center hidden sm:table-cell sortable" onclick="sortTable('sales_amt')">
                                sales_amt <span id="sort_sales_amt" class="ml-0.5 text-slate-300"><i class="fa-solid fa-arrow-down-wide-short"></i></span>
                            </th>
                            <th class="p-2 w-16 text-center hidden sm:table-cell sortable" onclick="sortTable('channel')">
                                channel
                            </th>
                            <th class="p-2 w-20 text-center hidden sm:table-cell">status</th>
                        </tr>
                    </thead>
                    <tbody id="txTableBody" class="divide-y divide-slate-100 text-xs text-slate-700">
                        <!-- Dynamic Order Records -->
                    </tbody>
                </table>
            </div>

            <!-- Footer Counter & Scroll Status -->
            <div class="p-2 border-t border-google-border bg-slate-50 flex items-center justify-between text-[11px] text-google-gray">
                <div>แสดง <span id="renderedCount" class="font-bold text-slate-800">0</span> / <span id="recordCount" class="font-bold text-slate-800">0</span> รายการ</div>
                <div id="infiniteLoader" class="hidden text-google-blue flex items-center gap-1 font-medium">
                    <i class="fa-solid fa-circle-notch animate-spin"></i> กำลังโหลด...
                </div>
            </div>
        </section>
    </main>

    <!-- Page Logic Script -->
    <script src="js/transactions.js"></script>
</body>
</html>
