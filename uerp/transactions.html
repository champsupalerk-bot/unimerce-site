<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-100 text-slate-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UERP - Order Management | Unimerce Co., Ltd.</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'google-blue': '#1a73e8',
                        'google-blueHover': '#1557b0',
                        'google-red': '#d93025',
                        'google-gray': '#5f6368',
                        'google-border': '#dadce0',

                        'lazada': '#0f146d',
                        'tiktok': '#000000'
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Global Header & Layout Script -->
    <script src="js/layoutuerp.js"></script>

    <style>
        body { 
            font-family: 'Inter', 'Noto Sans Thai', system-ui, -apple-system, sans-serif; 
            touch-action: manipulation;
        }
        .google-card {
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 12px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.05);
        }
        .google-select {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%235f6368' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 16px;
        }
        /* Selection Highlight */
        .row-selected {
            background-color: #e8f0fe !important;
        }
        /* Duplicate Row Highlight (Soft Amber) */
        .row-duplicate {
            background-color: #fff7ed !important;
        }
        .row-selected.row-duplicate {
            background-color: #fef08a !important;
        }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { background-color: #f1f5f9; }
        
        /* Minimal Circular Checkbox */
        .rounded-checkbox {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1.5px solid #94a3b8;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .rounded-checkbox:checked {
            background-color: #1a73e8;
            border-color: #1a73e8;
        }
        .rounded-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 2.5px;
            left: 2.5px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-100">

    <div id="headerContainer"></div>

            <div class="flex items-center gap-1.5">

        <!-- Minimal Sub-header Toolbar: Show PK Circle Checkbox & Main Filters -->
        <div class="google-card p-2 sm:p-3 bg-white space-y-2">

                        <option value="ALL" selected>สถานะทั้งหมด</option>

            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2">

                    <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ค้นหา Invoice, Order No, Item..." class="w-full pl-7 pr-2.5 py-1 border border-google-border rounded-md text-xs focus:outline-none focus:border-google-blue">

                        <option value="ALL">ทั้งหมด</option>

                        <option value="YESTERDAY">เมื่อวาน</option>
                        <option value="THIS_WEEK">สัปดาห์นี้</option>
                        <option value="THIS_MONTH">เดือนนี้</option>

            </div>

            <!-- Custom Date Range Inputs -->
            <div id="customDateContainer" class="hidden flex items-center justify-end gap-1.5 pt-1 text-xs text-slate-600">
                <input type="date" id="startDate" onchange="applyFilters()" class="border border-google-border rounded px-1.5 py-0.5 text-[11px]">
                <span>-</span>
                <input type="date" id="endDate" onchange="applyFilters()" class="border border-google-border rounded px-1.5 py-0.5 text-[11px]">
            </div>
        </div>

        <!-- Status Indicator -->
        <div id="statusIndicator" class="hidden p-2 bg-blue-50 rounded-lg border border-blue-100 text-xs text-google-blue">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-notch animate-spin text-xs"></i>
                <span id="statusText" class="font-medium text-[11px]">กำลังโหลดข้อมูล...</span>
            </div>
        </div>

                    <th class="p-2 hidden sm:table-cell sortable" onclick="sortTable('item_name')">

                <div id="infiniteLoader" class="hidden text-google-blue flex items-center gap-1 font-medium">

    <!-- Supabase & Business Logics Script -->
    <script>
        const supabaseUrl = "https://xygdmszernmircmbqwke.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5Z2Rtc3plcm5taXJjbWJxd2tlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NTY5NTAsImV4cCI6MjA5NzIzMjk1MH0.Qcq5h2TignXwhsyOe8IYcMYvlayyTjH66tTiPznVOOY";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let allTransactions = [];
        let filteredTransactions = [];
        let selectedRowIds = new Set();
        let pendingStatusChanges = {};
        let currentSortColumn = 'date';
        let currentSortAsc = false;
        
        let displayLimit = 50;
        const limitStep = 50;

        document.addEventListener('DOMContentLoaded', () => {
            loadHeader();
            fetchTransactions();
            setupInfiniteScroll();
        });

        async function loadHeader() {
            try {
                const res = await fetch('uerpheader.html');
                if (!res.ok) throw new Error('Header file not found');
                const html = await res.text();
                
                const headerContainer = document.getElementById('headerContainer');
                headerContainer.innerHTML = html;

                const txTab = headerContainer.querySelector('[data-page="transactions"]');
                if (txTab) txTab.classList.add('chrome-tab-active');

                if (typeof window.initUerpLayout === 'function') {
                    window.__uerpLayoutInitialized = false;
                    window.initUerpLayout();
                }
            } catch (err) {
                console.warn('Header load error:', err);
            }
        }

        // YY-MM-DD for Mobile, YYYY-MM-DD for Desktop
        function formatDateFormatted(dateStr, isMobile = false) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr.substring(0, 10);
            const iso = d.toISOString().split('T')[0]; // YYYY-MM-DD
            return isMobile ? iso.substring(2) : iso;   // YY-MM-DD on Mobile
        }

        function formatMoney(val) {
            return '฿' + parseFloat(val || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Truncate left for Invoice No (Shows last 4 digits on Mobile)
        function truncateInvoiceLeft(str) {
            if (!str) return '-';
            const s = String(str);
            if (s.length <= 8) return s;
            return '...' + s.slice(-4);
        }

        function updateStatus(msg, isError = false) {
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            statusIndicator.classList.remove('hidden');
            statusIndicator.className = isError 
                ? "p-2 bg-red-50 rounded-lg border border-red-200 text-xs text-google-red"
                : "p-2 bg-blue-50 rounded-lg border border-blue-100 text-xs text-google-blue";
            statusText.innerText = msg;
        }

        function forceRefreshData() {
            localStorage.removeItem('uerp_orders_cache');
            localStorage.removeItem('uerp_orders_cache_time');
            fetchTransactions(true);
        }

        async function fetchTransactions(isManualRefresh = false) {
            const cacheKey = 'uerp_orders_cache';
            const timeKey = 'uerp_orders_cache_time';
            const cachedData = localStorage.getItem(cacheKey);
            const cachedTime = localStorage.getItem(timeKey);
            const nowTime = new Date().getTime();

            if (!isManualRefresh && cachedData && cachedTime && (nowTime - Number(cachedTime) < 12 * 3600 * 1000)) {
                allTransactions = JSON.parse(cachedData);
                document.getElementById('statusIndicator').classList.add('hidden');
                applyFilters();
                return;
            }

            updateStatus('กำลังโหลดข้อมูล...');

            try {
                const { data, error } = await supabaseClient
                    .from('transactions')
                    .select('*')
                    .order('date', { ascending: false })
                    .limit(1000);

                if (error) throw error;

                allTransactions = (data || []).map((row, idx) => ({
                    ...row,
                    _rowId: row.id || `row_${idx}_${Date.now()}`
                }));

                localStorage.setItem(cacheKey, JSON.stringify(allTransactions));
                localStorage.setItem(timeKey, nowTime.toString());

                document.getElementById('statusIndicator').classList.add('hidden');
                applyFilters();
            } catch (err) {
                console.error("Supabase Query Error:", err);
                updateStatus(`เกิดข้อผิดพลาด: ${err.message}`, true);
            }
        }

        function handlePeriodChange() {
            const period = document.getElementById('periodFilter').value;
            const container = document.getElementById('customDateContainer');
            if (period === 'CUSTOM') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const channel = document.getElementById('channelFilter').value;
            const status = document.getElementById('statusFilter').value;
            const period = document.getElementById('periodFilter').value;
            const showPKOnly = document.getElementById('showPKToggle').checked;

            const now = new Date();
            let startFilterDate = null;
            let endFilterDate = null;

            // Default TODAY filter logic
            if (period === 'TODAY') {
                startFilterDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            } else if (period === 'YESTERDAY') {
                startFilterDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
                endFilterDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1, 23, 59, 59);
            } else if (period === 'THIS_WEEK') {
                const day = now.getDay() || 7;
                startFilterDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + 1);
            } else if (period === 'THIS_MONTH') {
                startFilterDate = new Date(now.getFullYear(), now.getMonth(), 1);
            } else if (period === 'LAST_MONTH') {
                startFilterDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                endFilterDate = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59);
            } else if (period === 'THIS_YEAR') {
                startFilterDate = new Date(now.getFullYear(), 0, 1);
            } else if (period === 'CUSTOM') {
                const s = document.getElementById('startDate').value;
                const e = document.getElementById('endDate').value;
                if (s) startFilterDate = new Date(s);
                if (e) endFilterDate = new Date(e + 'T23:59:59');
            }

            // Map duplicates for Invoice No & Order No
            const invoiceCounts = {};
            const orderCounts = {};
            allTransactions.forEach(item => {
                if (item.invoice_no) invoiceCounts[item.invoice_no] = (invoiceCounts[item.invoice_no] || 0) + 1;
                if (item.order_no) orderCounts[item.order_no] = (orderCounts[item.order_no] || 0) + 1;
            });

            filteredTransactions = allTransactions.filter(item => {
                if (showPKOnly && !selectedRowIds.has(item._rowId)) return false;

                const itemChannel = String(item.channel || '');
                const itemStatus = String(item.status || 'PENDING');
                
                const textMatch = !search || 
                    String(item.invoice_no || '').toLowerCase().includes(search) ||
                    String(item.order_no || '').toLowerCase().includes(search) ||
                    String(item.item_code || '').toLowerCase().includes(search) ||
                    String(item.item_name || '').toLowerCase().includes(search);

                const channelMatch = (channel === 'ALL' || itemChannel.toLowerCase() === channel.toLowerCase());
                const statusMatch = (status === 'ALL' || itemStatus.toUpperCase() === status.toUpperCase());

                let dateMatch = true;
                if (startFilterDate || endFilterDate) {
                    const rowDate = new Date(item.date);
                    if (startFilterDate && rowDate < startFilterDate) dateMatch = false;
                    if (endFilterDate && rowDate > endFilterDate) dateMatch = false;
                }

                item._isDuplicate = (invoiceCounts[item.invoice_no] > 1 || orderCounts[item.order_no] > 1);

                return textMatch && channelMatch && statusMatch && dateMatch;
            });

            // Sorting logic
            filteredTransactions.sort((a, b) => {
                let valA = a[currentSortColumn] ?? '';
                let valB = b[currentSortColumn] ?? '';
                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();

                if (valA < valB) return currentSortAsc ? -1 : 1;
                if (valA > valB) return currentSortAsc ? 1 : -1;
                return 0;
            });

            updateSortIcons();
            displayLimit = 50;
            renderTable();
        }

        function sortTable(column) {
            if (currentSortColumn === column) {
                currentSortAsc = !currentSortAsc;
            } else {
                currentSortColumn = column;
                currentSortAsc = true;
            }
            applyFilters();
        }

        function updateSortIcons() {
            ['date', 'invoice_no', 'item_code', 'item_name', 'sales_amt'].forEach(col => {
                const el = document.getElementById(`sort_${col}`);
                if (!el) return;
                if (col === currentSortColumn) {
                    el.className = "ml-0.5 text-[10px] text-google-blue font-bold";
                    el.innerHTML = currentSortAsc 
                        ? `<i class="fa-solid fa-arrow-up-wide-short"></i>` 
                        : `<i class="fa-solid fa-arrow-down-wide-short"></i>`;
                } else {
                    el.className = "ml-0.5 text-[10px] text-slate-300";
                    el.innerHTML = `<i class="fa-solid fa-arrow-down-wide-short"></i>`;
                }
            });
        }

        function renderTable() {
            const tbody = document.getElementById('txTableBody');
            tbody.innerHTML = '';

            const total = filteredTransactions.length;
            const pageData = filteredTransactions.slice(0, displayLimit);

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-google-gray">ไม่พบรายการคำสั่งซื้อ</td></tr>`;
            } else {
                pageData.forEach(row => {
                    const isSelected = selectedRowIds.has(row._rowId);
                    const isDup = row._isDuplicate;

                    // Channel Badge Styling
                    let channelBadgeClass = "bg-slate-100 text-slate-700 border-slate-200";
                    const ch = String(row.channel || '').toLowerCase();
                    if (ch.includes('shopee')) channelBadgeClass = "bg-shopee text-white";
                    else if (ch.includes('lazada')) channelBadgeClass = "bg-lazada text-white";
                    else if (ch.includes('tiktok')) channelBadgeClass = "bg-tiktok text-white";

                    const currentStatus = pendingStatusChanges[row._rowId] || row.status || 'PENDING';

                    const tr = document.createElement('tr');
                    
                    // Row Styling Rules:
                    // Selected Row = Blue Highlight
                    // Duplicate Row = Amber Highlight (Row Background)
                    let rowBgClass = "hover:bg-slate-50";
                    if (isDup) rowBgClass = "row-duplicate";
                    if (isSelected) rowBgClass = "row-selected";

                    tr.className = `transition-colors border-b border-slate-100 cursor-pointer ${rowBgClass}`;
                    
                    // Tap row to toggle selection (No checkbox column)
                    tr.onclick = (e) => {
                        if (e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION' || e.target.tagName === 'INPUT') return;
                        toggleRowSelection(row._rowId);
                    };

                    tr.innerHTML = `
                        <!-- Date Column -->
                        <td class="p-2 font-mono text-[11px] text-slate-600 whitespace-nowrap">
                            <span class="sm:hidden">${formatDateFormatted(row.date, true)}</span>
                            <span class="hidden sm:inline">${formatDateFormatted(row.date, false)}</span>
                        </td>

                        <!-- Invoice No & Order No Column (Mobile Layout Optimized) -->
                        <td class="p-2">
                            <!-- Mobile View (จัดลำดับและตัวหนา/บางให้ตรงกับ Desktop) -->
                            <div class="sm:hidden leading-tight">
                                <div class="font-bold text-slate-900 font-mono text-xs truncate max-w-[120px]" title="${row.invoice_no}">
                                    ${row.invoice_no || '-'}
                                </div>
                                <div class="text-[10px] text-google-gray font-mono truncate max-w-[90px]" title="${row.order_no}">
                                    ${row.order_no || '-'}
                                </div>
                            </div>

                            <!-- Desktop View -->
                            <div class="hidden sm:block leading-tight">
                                <div class="font-bold text-slate-900 font-mono">${row.invoice_no || '-'}</div>
                                <div class="text-[10px] text-google-gray font-mono">${row.order_no || '-'}</div>
                            </div>
                        </td>
                        <!-- Item Code -->
                        <td class="p-2 font-mono font-bold text-google-blue max-w-[90px] sm:max-w-[130px] truncate" title="${row.item_code}">
                            ${row.item_code || '-'}
                            <div class="sm:hidden text-[10px] font-normal text-slate-500 truncate" title="${row.item_name}">
                                ${row.item_name || ''}
                            </div>
                        </td>

                        <!-- Item Name (Desktop Only) -->
                        <td class="p-2 font-medium text-slate-800 hidden sm:table-cell max-w-[200px] truncate" title="${row.item_name}">
                            ${row.item_name || '-'}
                        </td>

                        <!-- Sales Amount (Desktop Only) -->
                        <td class="p-2 text-right font-bold text-slate-900 hidden sm:table-cell">
                            ${formatMoney(row.sales_amt)}
                        </td>

                        <!-- Channel Badge (Desktop Only) -->
                        <td class="p-2 text-center hidden sm:table-cell">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${channelBadgeClass}">
                                ${row.channel || 'Direct'}
                            </span>
                        </td>

                        <!-- Status Select Dropdown (Desktop Only) -->
                        <td class="p-2 text-center hidden sm:table-cell">
                            <select onchange="handleStatusChange('${row._rowId}', this.value)" class="bg-white border border-google-border rounded px-1 py-0.5 text-[10px] font-semibold focus:outline-none focus:border-google-blue">
                                <option value="PENDING" ${currentStatus === 'PENDING' ? 'selected' : ''}>PENDING</option>
                                <option value="ACTIVE" ${currentStatus === 'ACTIVE' ? 'selected' : ''}>ACTIVE</option>
                                <option value="VOID" ${currentStatus === 'VOID' ? 'selected' : ''}>VOID</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('renderedCount').innerText = pageData.length.toLocaleString();
            document.getElementById('recordCount').innerText = total.toLocaleString();
            document.getElementById('selectedCountText').innerText = selectedRowIds.size.toLocaleString();
            updatePendingChangesCount();
        }

        function toggleRowSelection(rowId) {
            if (selectedRowIds.has(rowId)) {
                selectedRowIds.delete(rowId);
            } else {
                selectedRowIds.add(rowId);
            }
            renderTable();
        }

        function handleStatusChange(rowId, newStatus) {
            pendingStatusChanges[rowId] = newStatus;
            updatePendingChangesCount();
        }

        function updatePendingChangesCount() {
            const count = Object.keys(pendingStatusChanges).length;
            document.getElementById('pendingChangesCount').innerText = count;
            document.getElementById('submitBtn').disabled = count === 0;
        }

        async function submitChanges() {
            const count = Object.keys(pendingStatusChanges).length;
            if (count === 0) return;

            updateStatus(`กำลังบันทึก ${count} รายการลง Supabase...`);

            try {
                const updatePromises = Object.keys(pendingStatusChanges).map(rowId => {
                    const item = allTransactions.find(t => t._rowId === rowId);
                    if (!item || !item.id) return Promise.resolve();

                    const newStatus = pendingStatusChanges[rowId];
                    return supabaseClient
                        .from('transactions')
                        .update({ status: newStatus })
                        .eq('id', item.id);
                });

                await Promise.all(updatePromises);
                
                Object.keys(pendingStatusChanges).forEach(rowId => {
                    const item = allTransactions.find(t => t._rowId === rowId);
                    if (item) item.status = pendingStatusChanges[rowId];
                });

                pendingStatusChanges = {};
                localStorage.setItem('uerp_orders_cache', JSON.stringify(allTransactions));
                
                updateStatus('บันทึกเรียบร้อย!');
                setTimeout(() => document.getElementById('statusIndicator').classList.add('hidden'), 2000);
                applyFilters();
            } catch (err) {
                console.error("Submit Error:", err);
                updateStatus(`เกิดข้อผิดพลาด: ${err.message}`, true);
            }
        }

        function setupInfiniteScroll() {
            window.addEventListener('scroll', () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 250) {
                    if (displayLimit < filteredTransactions.length) {
                        document.getElementById('infiniteLoader').classList.remove('hidden');
                        setTimeout(() => {
                            displayLimit += limitStep;
                            renderTable();
                            document.getElementById('infiniteLoader').classList.add('hidden');
                        }, 150);
                    }
                }
            });
        }
    </script>
</body>
</html>
