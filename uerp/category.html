<script src="/uerp/config.js"></script>
<script>
/* =========================
   LOAD SHARED UERP HEADER
   Load layout engine after header injection.
========================= */
async function loadUerpHeader() {
  const container = document.getElementById('headerContainer');
  if (!container) return;

  try {
    const response = await fetch('/uerp/uerpheader.html');
    if (!response.ok) throw new Error(`Header not found: ${response.status}`);

    container.innerHTML = await response.text();

    const script = document.createElement('script');
    script.src = '/uerp/layoutuerp.js';

    script.onload = () => {
      if (typeof window.initUerpLayout === 'function') {
        window.initUerpLayout();
      }
    };

    script.onerror = () => console.error('Failed to load /uerp/layoutuerp.js');
    document.body.appendChild(script);
  } catch (error) {
    console.error('UERP header error:', error);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadUerpHeader);
} else {
  loadUerpHeader();
}

/* =========================
   CATEGORY ANALYSIS
========================= */
const CACHE_KEY = 'uerp_category_view_cache_v2';
const CACHE_TIME_KEY = 'uerp_category_view_cache_time_v2';
const CACHE_TTL = 60 * 60 * 1000;

let allData = [];
let categoryChart = null;
let tableSort = { key: 'month', direction: 'asc' };

const money = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const number = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
const monthFmt = new Intl.DateTimeFormat('en-US', { month: 'short', year: 'numeric', timeZone: 'UTC' });
const chartColors = [
  '#2f5ea8','#2a75a0','#56a3a6','#e0a458','#7b83c7',
  '#d16b70','#68a36b','#9b7bb5','#7d8795','#d58a55',
  '#4f9b8f','#b4a24c','#5276a5','#c16e9c','#6e9bcb'
];

const $ = id => document.getElementById(id);
const asNum = value => {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
};
const moneyText = value => money.format(asNum(value));

function getBangkokNow() {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Bangkok',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).formatToParts(new Date());

  const get = type => Number(parts.find(part => part.type === type).value);
  return new Date(Date.UTC(get('year'), get('month') - 1, get('day')));
}

function parseMonth(value) {
  if (!value) return null;

  const match = String(value).match(/^(\d{4})-(\d{2})/);
  if (match) {
    return new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, 1));
  }

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return null;

  return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), 1));
}

function monthKey(date) {
  return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}-01`;
}

function getPeriodRange(period) {
  const now = getBangkokNow();
  const current = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1));
  let start;
  let end;

  if (period === 'this_month') {
    start = current;
    end = current;
  } else if (period === 'last_month') {
    start = new Date(Date.UTC(current.getUTCFullYear(), current.getUTCMonth() - 1, 1));
    end = start;
  } else if (period === 'last_3_months') {
    start = new Date(Date.UTC(current.getUTCFullYear(), current.getUTCMonth() - 2, 1));
    end = current;
  } else if (period === 'this_year') {
    start = new Date(Date.UTC(current.getUTCFullYear(), 0, 1));
    end = current;
  } else {
    start = new Date(Date.UTC(current.getUTCFullYear() - 1, 0, 1));
    end = new Date(Date.UTC(current.getUTCFullYear() - 1, 11, 1));
  }

  const months = [];
  for (
    let date = new Date(start);
    date <= end;
    date = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + 1, 1))
  ) {
    months.push(new Date(date));
  }

  return { start, end, months };
}

function currentRows() {
  const range = getPeriodRange($('periodSelect').value);

  return allData.filter(row => {
    const date = parseMonth(row.month);
    return date && date >= range.start && date <= range.end;
  });
}

async function fetchAllRows() {
  if (typeof window.supabaseFetch !== 'function') {
    throw new Error('window.supabaseFetch is not defined. Check /uerp/config.js.');
  }

  const batchSize = 1000;
  let offset = 0;
  let rows = [];

  while (true) {
    const batch = await window.supabaseFetch('view_category_sales', {
      limit: batchSize,
      offset
    });

    if (!Array.isArray(batch)) {
      throw new Error('Supabase did not return an array for view_category_sales.');
    }

    rows = rows.concat(batch);
    if (batch.length < batchSize) break;
    offset += batchSize;
  }

  return rows;
}

async function loadData(force = false) {
  const button = $('btnRefresh');
  button.disabled = true;
  button.innerHTML = '<i class="fa-solid fa-rotate fa-spin mr-2"></i>Loading';
  $('errorBox').hidden = true;
  $('execLog').textContent = 'Loading category data...';

  try {
    const cached = localStorage.getItem(CACHE_KEY);
    const cachedTime = Number(localStorage.getItem(CACHE_TIME_KEY) || 0);

    if (!force && cached && Date.now() - cachedTime < CACHE_TTL) {
      allData = JSON.parse(cached);
      $('execLog').textContent = `${allData.length.toLocaleString()} rows (Cache)`;
    } else {
      allData = await fetchAllRows();
      localStorage.setItem(CACHE_KEY, JSON.stringify(allData));
      localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
      $('execLog').textContent = `${allData.length.toLocaleString()} rows (Live)`;
    }

    renderAll();
  } catch (error) {
    console.error('Category page load error:', error);

    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      try {
        allData = JSON.parse(cached);
        $('execLog').textContent = `${allData.length.toLocaleString()} rows (Offline cache)`;
        renderAll();
        showError(`Using cached data. ${error.message}`);
      } catch (_) {
        showError(error.message);
      }
    } else {
      showError(error.message);
    }
  } finally {
    button.disabled = false;
    button.innerHTML = '<i class="fa-solid fa-rotate mr-2"></i>Refresh';
  }
}

function showError(message) {
  $('errorBox').hidden = false;
  $('errorBox').textContent = `Unable to load category data: ${message}`;
  $('execLog').textContent = 'Load failed';
}

function categoryName(row) {
  return String(row.maincategory || 'Uncategorized').trim() || 'Uncategorized';
}

function renderAll() {
  const rows = currentRows();
  const periodText = $('periodSelect').selectedOptions[0].textContent;

  $('chartPeriodNote').textContent = `${periodText} · Contribution by main category`;

  renderChart(rows);
  renderTable();
}

function compactValue(value) {
  const n = asNum(value);
  const abs = Math.abs(n);

  if (abs >= 1e6) return `${(n / 1e6).toFixed(1).replace(/\.0$/, '')}m`;
  if (abs >= 1e3) return `${(n / 1e3).toFixed(1).replace(/\.0$/, '')}k`;
  return number.format(n);
}

const doughnutCenterPlugin = {
  id: 'doughnutCenterTotal',
  afterDraw(chart) {
    if (chart.config.type !== 'doughnut') return;

    const { ctx, chartArea } = chart;
    if (!chartArea) return;

    const total = (chart.data.datasets[0].data || []).reduce(
      (sum, value) => sum + asNum(value),
      0
    );

    const x = (chartArea.left + chartArea.right) / 2;
    const y = (chartArea.top + chartArea.bottom) / 2;
    const metric = $('chartMetric').value === 'gpm' ? 'Total GPM' : 'Total Sales';
    const centerValue = compactValue(total);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#6b7280';
    ctx.font = '600 12px Arial, sans-serif';
    ctx.fillText(metric, x, y - 14);

    ctx.fillStyle = '#111827';
    ctx.font = '700 24px Arial, sans-serif';
    ctx.fillText(centerValue, x, y + 14);

    ctx.restore();
  }
};

function renderChart(rows) {
  const metric = $('chartMetric').value;
  const totals = new Map();

  rows.forEach(row => {
    const category = categoryName(row);
    totals.set(category, (totals.get(category) || 0) + asNum(row[metric]));
  });

  const sorted = [...totals.entries()].sort((a, b) => b[1] - a[1]);
  const labels = sorted.map(item => item[0]);
  const values = sorted.map(item => item[1]);
  const total = values.reduce((sum, value) => sum + value, 0);

  if (categoryChart) categoryChart.destroy();

  categoryChart = new Chart($('categoryChart'), {
    type: 'doughnut',
    plugins: [doughnutCenterPlugin, ChartDataLabels],
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: labels.map((_, index) => chartColors[index % chartColors.length]),
        borderColor: '#ffffff',
        borderWidth: 2,
        hoverOffset: 5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '55%',
      layout: { padding: 12 },
      plugins: {
        legend: { display: false },
        datalabels: {
          display: context => {
            const value = asNum(context.dataset.data[context.dataIndex]);
            return total > 0 && value / total >= 0.055;
          },
          color: '#ffffff',
          textAlign: 'center',
          anchor: 'center',
          align: 'center',
          clamp: true,
          font: { size: 10, weight: 'bold' },
          textStrokeColor: 'rgba(0,0,0,0.18)',
          textStrokeWidth: 2,
          formatter: (value, context) => {
            const percentage = total ? (asNum(value) / total * 100) : 0;
            const label = context.chart.data.labels[context.dataIndex] || '';
            return [label, `${percentage.toFixed(1)}%`];
          }
        },
        tooltip: {
          callbacks: {
            label: context => {
              const value = asNum(context.raw);
              const percentage = total ? value / total * 100 : 0;
              return `${context.label}: ${moneyText(value)} (${percentage.toFixed(1)}%)`;
            }
          }
        }
      }
    }
  });

  $('categoryLegend').innerHTML = sorted.map(([label, value], index) => `
    <div class="flex items-center gap-2 text-xs text-gray-600">
      <span class="inline-block w-2 h-2 rounded-full flex-shrink-0" style="background:${chartColors[index % chartColors.length]}"></span>
      <span>${escapeHtml(label)}: <strong>${moneyText(value)}</strong>${total ? ` (${(value / total * 100).toFixed(1)}%)` : ''}</span>
    </div>
  `).join('') || '<span class="text-xs text-gray-400">No category data for this period.</span>';
}

function currentYearMonths() {
  const now = getBangkokNow();
  const year = now.getUTCFullYear();

  return Array.from({ length: 12 }, (_, index) =>
    new Date(Date.UTC(year, index, 1))
  );
}

function buildYearMatrix() {
  const months = currentYearMonths();
  const categories = [...new Set(allData.map(categoryName))]
    .sort((a, b) => a.localeCompare(b));

  const matrix = new Map();

  allData.forEach(row => {
    const date = parseMonth(row.month);
    if (!date || date.getUTCFullYear() !== months[0].getUTCFullYear()) return;

    const key = `${monthKey(date)}|||${categoryName(row)}`;

    if (!matrix.has(key)) {
      matrix.set(key, { sales: 0, gpm: 0 });
    }

    const cell = matrix.get(key);
    cell.sales += asNum(row.sales_amt);
    cell.gpm += asNum(row.gpm);
  });

  return { months, categories, matrix };
}

function metricValue(cell, metric) {
  if (metric === 'gpm') return cell.gpm;
  if (metric === 'gpm_percent') return cell.sales !== 0 ? cell.gpm / cell.sales * 100 : 0;
  return cell.sales;
}

function formatMetric(value, metric) {
  if (metric === 'gpm_percent') return `${value.toFixed(2)}%`;
  return value ? moneyText(value) : '—';
}

function renderTable() {
  const metric = $('tableMetric').value;
  const { months, categories, matrix } = buildYearMatrix();
  const year = months[0].getUTCFullYear();

  const rows = months.map(month => {
    const values = categories.map(category => {
      return matrix.get(`${monthKey(month)}|||${category}`) || { sales: 0, gpm: 0 };
    });

    const totalSales = values.reduce((sum, cell) => sum + cell.sales, 0);
    const totalGpm = values.reduce((sum, cell) => sum + cell.gpm, 0);

    return {
      month,
      monthLabel: monthFmt.format(month),
      values,
      totalSales,
      totalGpm,
      total: { sales: totalSales, gpm: totalGpm }
    };
  });

  const getSortValue = row => {
    if (tableSort.key === 'month') return row.month.getTime();

    if (tableSort.key === 'total') {
      return metricValue(row.total, metric);
    }

    const categoryIndex = categories.indexOf(tableSort.key);
    if (categoryIndex >= 0) {
      return metricValue(row.values[categoryIndex], metric);
    }

    return 0;
  };

  rows.sort((a, b) => {
    const comparison = getSortValue(a) - getSortValue(b);
    return tableSort.direction === 'asc' ? comparison : -comparison;
  });

  const sortButton = (key, label, align = 'right') => {
    const active = tableSort.key === key;
    const direction = active ? tableSort.direction : '';
    const icon = active ? (direction === 'asc' ? '▲' : '▼') : '↕';

    return `<button type="button" class="sort-btn" data-sort="${escapeHtml(key)}" aria-sort="${active ? (direction === 'asc' ? 'ascending' : 'descending') : 'none'}" style="justify-content:${align === 'left' ? 'flex-start' : 'flex-end'};width:100%">
      <span>${escapeHtml(label)}</span><span class="sort-icon">${icon}</span>
    </button>`;
  };

  const thead = $('categoryTable').querySelector('thead');
  const tbody = $('categoryTable').querySelector('tbody');

  thead.innerHTML = `<tr>
    <th>${sortButton('month', 'Month', 'left')}</th>
    ${categories.map(category => `<th>${sortButton(category, category)}</th>`).join('')}
    <th>${sortButton('total', 'Total')}</th>
  </tr>`;

  const columnTotals = categories.map(() => ({ sales: 0, gpm: 0 }));
  let grandSales = 0;
  let grandGpm = 0;

  rows.forEach(row => {
    row.values.forEach((cell, index) => {
      columnTotals[index].sales += cell.sales;
      columnTotals[index].gpm += cell.gpm;
    });
    grandSales += row.totalSales;
    grandGpm += row.totalGpm;
  });

  tbody.innerHTML = rows.map(row => {
    const cells = row.values.map(cell =>
      `<td>${formatMetric(metricValue(cell, metric), metric)}</td>`
    ).join('');

    return `<tr>
      <td>${escapeHtml(row.monthLabel)}</td>
      ${cells}
      <td class="font-semibold">${formatMetric(metricValue(row.total, metric), metric)}</td>
    </tr>`;
  }).join('');

  const totalCells = columnTotals.map(cell =>
    `<td>${formatMetric(metricValue(cell, metric), metric)}</td>`
  ).join('');

  const grandTotal = { sales: grandSales, gpm: grandGpm };

  tbody.insertAdjacentHTML('beforeend', `<tr class="total-row">
    <td>Total</td>
    ${totalCells}
    <td>${formatMetric(metricValue(grandTotal, metric), metric)}</td>
  </tr>`);

  $('tableSummary').textContent =
    `${year} · 12 months · ${categories.length} categories · Values: ${
      metric === 'gpm' ? 'GPM' : metric === 'gpm_percent' ? 'GPM % (GPM ÷ Sales)' : 'Sales Amount'
    }`;

  thead.querySelectorAll('[data-sort]').forEach(button => {
    button.addEventListener('click', () => {
      const key = button.dataset.sort;

      if (tableSort.key === key) {
        tableSort.direction = tableSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        tableSort.key = key;
        tableSort.direction = key === 'month' ? 'asc' : 'desc';
      }

      renderTable();
    });
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[character]);
}

$('periodSelect').addEventListener('change', renderAll);
$('chartMetric').addEventListener('change', () => renderChart(currentRows()));
$('tableMetric').addEventListener('change', renderTable);
$('btnRefresh').addEventListener('click', () => loadData(true));

window.addEventListener('load', () => loadData(false));
</script>
</body>
</html>
