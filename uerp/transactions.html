<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>UNIMERCE | Order Management</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link rel="stylesheet" href="transactions.css" />
</head>

<body class="bg-gray-50 text-slate-800">

    <!-- =========================================================
         HEADER
    ========================================================== -->
    <div id="uerpHeader"></div>


    <!-- =========================================================
         MAIN
    ========================================================== -->
    <main class="max-w-[1600px] mx-auto px-3 sm:px-5 py-4">

        <!-- =====================================================
             TOP BAR
        ====================================================== -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">

            <div class="flex items-center gap-3">

                <h1 class="text-xl font-bold text-slate-800">
                    Order Management
                </h1>

                <span
                    id="orderCountTop"
                    class="text-sm text-google-gray"
                >
                    0 orders
                </span>

            </div>

            <div class="flex items-center gap-2">

                <button
                    id="submitBtn"
                    onclick="submitChanges()"
                    class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition"
                >
                    <i class="fa-solid fa-floppy-disk mr-1"></i>
                    Save
                </button>

                <button
                    onclick="forceRefreshData()"
                    class="px-3 py-2 rounded-lg bg-white border border-gray-200 text-slate-600 hover:bg-gray-50 transition"
                    title="Refresh"
                >
                    <i class="fa-solid fa-rotate"></i>
                </button>

            </div>

        </div>


        <!-- =====================================================
             TOOLBAR
        ====================================================== -->
        <div class="google-card p-3 mb-4">

            <div class="flex flex-wrap items-center gap-2">

                <!-- Show PK -->
                <label class="flex items-center gap-2 cursor-pointer mr-2">

                    <input
                        type="checkbox"
                        id="showPKToggle"
                        onchange="applyFilters()"
                        class="rounded-checkbox"
                    />

                    <span class="text-xs font-medium text-slate-600">
                        showPK
                        (<span id="selectedCountText">0</span>)
                    </span>

                </label>


                <!-- Channel -->
                <select
                    id="channelFilter"
                    onchange="applyFilters()"
                    class="google-select"
                >
                    <option value="">All Channels</option>
                    <option value="Shopee">Shopee</option>
                    <option value="Lazada">Lazada</option>
                    <option value="TikTok">TikTok</option>
                    <option value="Website">Website</option>
                    <option value="Facebook">Facebook</option>
                    <option value="LINE">LINE</option>
                    <option value="Walk-in">Walk-in</option>
                </select>


                <!-- Status -->
                <select
                    id="statusFilter"
                    onchange="applyFilters()"
                    class="google-select"
                >
                    <option value="">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Processing">Processing</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>


                <!-- Search -->
                <div class="relative flex-1 min-w-[220px]">

                    <i
                        class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"
                    ></i>

                    <input
                        type="text"
                        id="searchInput"
                        oninput="applyFilters()"
                        placeholder="Search order, customer, item..."
                        class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:border-blue-400"
                    />

                </div>


                <!-- Period -->
                <div class="flex items-center gap-1">

                    <button
                        class="period-btn"
                        data-period="TODAY"
                        onclick="setPeriod('TODAY')"
                    >
                        Today
                    </button>

                    <button
                        class="period-btn"
                        data-period="YESTERDAY"
                        onclick="setPeriod('YESTERDAY')"
                    >
                        Yesterday
                    </button>

                    <button
                        class="period-btn"
                        data-period="7DAYS"
                        onclick="setPeriod('7DAYS')"
                    >
                        7 Days
                    </button>

                    <button
                        class="period-btn"
                        data-period="30DAYS"
                        onclick="setPeriod('30DAYS')"
                    >
                        30 Days
                    </button>

                    <button
                        class="period-btn"
                        data-period="CUSTOM"
                        onclick="toggleCustomPeriodMenu()"
                    >
                        Custom
                    </button>

                </div>

            </div>


            <!-- =================================================
                 CUSTOM PERIOD
            ================================================== -->
            <div
                id="customPeriodMenu"
                class="hidden mt-3 pt-3 border-t border-gray-100"
            >

                <div class="flex flex-wrap items-end gap-3">

                    <div>
                        <label class="block text-[11px] text-gray-500 mb-1">
                            From
                        </label>

                        <input
                            type="date"
                            id="customStartDate"
                            class="google-select"
                        />
                    </div>

                    <div>
                        <label class="block text-[11px] text-gray-500 mb-1">
                            To
                        </label>

                        <input
                            type="date"
                            id="customEndDate"
                            class="google-select"
                        />
                    </div>

                    <button
                        onclick="applyCustomPeriod()"
                        class="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700"
                    >
                        Apply
                    </button>

                </div>

            </div>

        </div>


        <!-- =====================================================
             TABLE
        ====================================================== -->
        <div class="google-card overflow-hidden">

            <div class="overflow-x-auto">

                <table class="w-full text-sm">

                    <thead class="bg-gray-50 border-b border-gray-200">

                        <tr>

                            <th
                                class="px-3 py-3 text-left text-xs font-semibold text-gray-500 whitespace-nowrap"
                                onclick="sortTable('date')"
                            >
                                Date
                                <i class="sort-icon fa-solid fa-sort text-[9px] ml-1"></i>
                            </th>

                            <th
                                class="px-3 py-3 text-left text-xs font-semibold text-gray-500 whitespace-nowrap"
                                onclick="sortTable('invoice_no')"
                            >
                                order_no
                                <i class="sort-icon fa-solid fa-sort text-[9px] ml-1"></i>
                            </th>

                            <th
                                class="px-3 py-3 text-left text-xs font-semibold text-gray-500 whitespace-nowrap"
                            >
                                Item Code
                            </th>

                            <th
                                class="px-3 py-3 text-left text-xs font-semibold text-gray-500 whitespace-nowrap"
                            >
                                Item Name
                            </th>

                            <th
                                class="px-3 py-3 text-right text-xs font-semibold text-gray-500 whitespace-nowrap"
                            >
                                Qty
                            </th>

                            <th
                                class="px-3 py-3 text-right text-xs font-semibold text-gray-500 whitespace-nowrap"
                            >
                                Sales Amt
                            </th>

                            <th
                                class="px-3 py-3 text-left text-xs font-semibold text-gray-500 whitespace-nowrap"
                            >
                                Channel
                            </th>

                            <th
                                class="px-3 py-3 text-left text-xs font-semibold text-gray-500 whitespace-nowrap"
                            >
                                Status
                            </th>

                        </tr>

                    </thead>

                    <tbody id="txTableBody"></tbody>

                </table>

            </div>

        </div>

    </main>


    <!-- =========================================================
         SHIPPING LABEL PREVIEW MODAL
         สร้าง/เติมข้อมูลโดย transactions.js
    ========================================================== -->
    <div
        id="shippingLabelModal"
        class="fixed inset-0 z-[9999] hidden"
    >

        <div
            id="shippingLabelBackdrop"
            class="absolute inset-0 bg-black/60"
            onclick="closeShippingLabelModal()"
        ></div>


        <div
            class="relative z-10 w-full h-full overflow-auto flex items-start justify-center p-4 sm:p-6"
        >

            <div class="w-full max-w-[900px]">

                <!-- Modal toolbar -->
                <div
                    class="bg-white rounded-t-xl border-b border-gray-200 px-4 py-3 flex items-center justify-between gap-3 sticky top-0 z-20"
                >

                    <div class="font-semibold text-slate-800">
                        Shipping Label Preview
                    </div>

                    <div class="flex items-center gap-2">

                        <button
                            type="button"
                            onclick="downloadShippingLabelPDF()"
                            class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700"
                        >
                            <i class="fa-solid fa-file-pdf mr-1"></i>
                            Save PDF
                        </button>

                        <button
                            type="button"
                            onclick="closeShippingLabelModal()"
                            class="w-9 h-9 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200"
                            title="Close"
                        >
                            <i class="fa-solid fa-xmark"></i>
                        </button>

                    </div>

                </div>


                <!-- A5 paper -->
                <div
                    class="bg-gray-100 p-4 sm:p-8 rounded-b-xl flex justify-center overflow-auto"
                >

                    <div
                        id="shippingLabelPaper"
                        class="shipping-label-paper bg-white"
                    >

                        <!-- Filled by transactions.js -->

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         JS
    ========================================================== -->
    <script src="transactions.js"></script>

</body>
</html>
