<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UNIMERCE UERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ดึง config.js เพื่อใช้ window.supabaseFetch -->
    <script src="/uerp/config.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-sm">
                <i class="fa-solid fa-layer-group text-lg"></i>
            </div>
            <div>
                <div class="text-base font-bold text-slate-800 tracking-tight">UNIMERCE UERP</div>
                <div class="text-xs text-slate-500">Business Intelligence Platform</div>
            </div>
        </div>

        <h1 class="text-xl font-bold text-slate-800 mb-1">เข้าสู่ระบบ</h1>
        <p class="text-sm text-slate-500 mb-6">กรอกรหัสผ่านเพื่อเข้าใช้งานระบบภายใน</p>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">PASSWORD</label>
                <input type="password" id="passwordInput" required autofocus
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition"
                       placeholder="กรอกรหัสผ่านเข้าใช้งาน">
            </div>

            <div id="errorMsg" class="hidden text-xs text-red-500 font-medium flex items-center gap-1.5">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</span>
            </div>

            <button type="submit" id="btnSubmit"
                    class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm rounded-xl transition shadow-sm flex items-center justify-center gap-2">
                <span>เข้าสู่ระบบ</span>
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const passInput = document.getElementById("passwordInput").value;
            const errorMsg = document.getElementById("errorMsg");
            const btnSubmit = document.getElementById("btnSubmit");

            errorMsg.classList.add("hidden");
            btnSubmit.disabled = true;
            btnSubmit.innerText = "กำลังตรวจสอบ...";

            try {
                // ยิงไปตรวจรหัสผ่านกับ Supabase
                const data = await window.supabaseFetch(`/uerp_passwords?pass_key=eq.${encodeURIComponent(passInput)}`);

                if (data && data.length > 0) {
                    // รหัสผ่านถูกต้อง -> สร้าง Session Token
                    localStorage.setItem("uerp_auth_token", "AUTHENTICATED_SESSION_OK");
                    localStorage.setItem("uerp_auth_timestamp", Date.now().toString());

                    // ดึง URL ที่ผู้ใช้เคยพยายามจะเข้าไว้ (ถ้าไม่มีส่งไปหน้า inventory)
                    const redirectTarget = localStorage.getItem("uerp_redirect_target") || "/uerp/inventory";
                    localStorage.removeItem("uerp_redirect_target");

                    window.location.replace(redirectTarget);
                } else {
                    // รหัสผ่านผิด
                    errorMsg.classList.remove("hidden");
                    document.getElementById("passwordInput").select();
                }
            } catch (err) {
                console.error("Login Error:", err);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "เข้าสู่ระบบ";
            }
        }
    </script>
</body>
</html>
