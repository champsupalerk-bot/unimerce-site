<style>
/* =========================
   GLOBAL
========================= */
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#fafafa;
  color:#111;
  padding-top:40px;
}
/* =========================
   HEADER
========================= */
.header{
  max-width:1000px;
  margin:auto;
  padding:24px 20px 10px;
}
.breadcrumb{
  font-size:12px;
  color:#888;
  margin-bottom:10px;
}
.breadcrumb a{
  color:#888;
  text-decoration:none;
  font-weight:bold;
}
.breadcrumb a:hover{
  text-decoration:underline;
  color:#2f5ea8;
}
.title{
  font-size:28px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:16px;
}
/* =========================
   SEARCHBAR
========================= */
.filterbar{
  max-width:1000px;
  margin:0 auto 15px auto;
  padding:0 20px;
}
.filterbar input{
  width:100%;
  padding:10px 12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
  outline:none;
  box-sizing:border-box;
  transition:all 0.2s ease;
}
.filterbar input:focus{
  border-color:#2f5ea8;
  box-shadow:0 0 0 3px rgba(47,94,168,0.15);
}
/* =========================
   CATEGORY FILTER
========================= */
.category-filter-bar{
  max-width:1000px;
  margin:0 auto 15px auto;
  padding:0 20px;
  display:flex;
  flex-wrap:wrap;
  gap:16px;
}
.category-label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:500;
  color:#444;
  cursor:pointer;
  user-select:none;
  position:relative;
}
.category-label input[type="checkbox"]{
  position:absolute;
  opacity:0;
  cursor:pointer;
  height:0;
  width:0;
}
.checkmark{
  height:18px;
  width:18px;
  background-color:#fff;
  border:2px solid #ccc;
  border-radius:50%;
  display:inline-block;
  position:relative;
  transition:all 0.2s ease;
}
.category-label:hover input ~ .checkmark{
  border-color:#2f5ea8;
}
.category-label input:checked ~ .checkmark{
  background-color:#2f5ea8;
  border-color:#2f5ea8;
}
.checkmark:after{
  content:"";
  position:absolute;
  display:none;
  top:5px;
  left:5px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:white;
}
.category-label input:checked ~ .checkmark:after{
  display:block;
}
/* =========================
   PAGINATION
========================= */
.pagination-bar{
  max-width:1000px;
  margin:40px auto 10px auto;
  padding:0 20px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.page-btn{
  background:#fff;
  color:#444;
  border:1px solid #e5e7eb;
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:500;
  border-radius:10px;
  cursor:pointer;
  user-select:none;
  transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 1px 2px rgba(0,0,0,0.02);
}
.page-btn.nav-arrow{
  width:42px;
  font-size:16px;
}
.page-btn:hover:not(:disabled){
  background:#f8fafc;
  border-color:#cbd5e1;
  color:#1e293b;
  transform:translateY(-1px);
}
.page-btn.active{
  background:#2f5ea8;
  color:#fff;
  border-color:#2f5ea8;
  font-weight:600;
  box-shadow:0 4px 12px rgba(47,94,168,0.25);
}
.page-btn:disabled{
  background:#f1f5f9;
  color:#cbd5e1;
  border-color:#e2e8f0;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}
/* =========================
   GRID
========================= */
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:22px;
  align-items:start;
}
/* =========================
   PROMOTION CARD
========================= */
.promo-card{
  background:linear-gradient(135deg,#3a5a40,#344e41);
  color:#fff;
  border-radius:18px;
  padding:18px;
  min-height:280px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
  overflow:hidden;
  width:100%;
  box-sizing:border-box;
  break-inside:avoid;
  -webkit-column-break-inside:avoid;
  display:inline-block;
}
.promo-tag{
  font-size:11px;
  letter-spacing:2px;
  opacity:0.7;
  margin-bottom:14px;
}
.promo-title{
  font-size:20px;
  font-weight:700;
  line-height:1.15;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
  margin-bottom:12px;
}
.promo-desc{
  font-size:13px;
  line-height:1.7;
  opacity:0.8;
}

.card-link{
  display:block;
  text-decoration:none;
  color:inherit;
}

.card-link:visited,
.card-link:hover,
.card-link:active{
  text-decoration:none;
  color:inherit;
}

/* =========================
   PRODUCT CARD
========================= */
.card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,0.06);
  border:1px solid #eee;
  transition:0.2s ease;
  width:100%;
  max-width:280px;
  justify-self:center;
  box-sizing:border-box;
  cursor:pointer;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 24px rgba(0,0,0,0.10);
}
.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#f3f3f3;
}
.card .content{
  padding:12px;
  box-sizing:border-box;
}
.content{
  padding:14px;
}
/* =========================
   TOP INFO
========================= */
.top-info{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  margin-bottom:8px;
  gap:10px;
}
.sku{
  font-size:14px;
  font-weight:600;
  color:#111;
}
.category{
  font-size:11px;
  color:#888;
  text-align:right;
}
/* =========================
   PRODUCT INFO
========================= */
.name{
  font-size:15px;
  font-weight:600;
  line-height:1.5;
  margin-bottom:12px;
  min-height:44px;
}
/* =========================
   PRICE + STOCK
========================= */
.bottom-row{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:end;
  gap:10px;
}
.price-box{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.price-old{
  font-size:13px;
  color:#999;
  text-decoration:line-through;
}
.price-new{
  font-size:22px;
  font-weight:700;
  color:#111;
  line-height:1;
}
.stock-box{
  text-align:right;
}
.stock-label{
  font-size:11px;
  color:#999;
  margin-bottom:2px;
}
.stock-value{
  font-size:16px;
  font-weight:600;
  color:#111;
}
/* =========================
   LOADING
========================= */
.loading{
  text-align:center;
  color:#888;
  padding:40px;
  grid-column:1/-1;
}
/* =========================
   MOBILE
========================= */
@media(max-width:768px){
  .container{
    padding:12px;
  }
  .grid{
    column-count:2;
    column-gap:6px;
    display:block;
  }
  .card,
  .promo-card{
    break-inside:avoid;
    margin-bottom:3px;
    display:inline-block;
    width:100%;
  }
  .promo-card{
    min-height:140px;
    border-radius:16px;
    padding:14px;
  }
  .promo-title{
    font-size:18px;
    line-height:1.15;
    margin-bottom:8px;
  }
  .promo-desc{
    font-size:11px;
    line-height:1.5;
  }
  .promo-tag{
    font-size:10px;
    margin-bottom:10px;
  }
  .content{
    padding:12px;
  }
  .name{
    font-size:13px;
    min-height:auto;
  }
  .price-new{
    font-size:18px;
  }
  .sku{
    font-size:13px;
  }
  .stock-value{
    font-size:14px;
  }
  .title{
    font-size:24px;
  }
}
@media(min-width:1024px){
  .name{
    font-weight:500;
    letter-spacing:0.2px;
  }
  .price-new{
    font-weight:600;
  }
  .title{
    font-weight:700;
  }
  body{
    font-weight:400;
  }
}
</style>
