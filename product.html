<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Sales Contribution - UERP</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js สำหรับวาด Donut Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase Client (ถ้ามีไฟล์คลาสเดิม ให้ใช้ของเดิมได้เลย) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">

  <!-- ===== 1. HEADER (Dynamic Load เหมือนหน้าเดิม) ===== -->
  <div id="uerp-header-container" class="mb-3"></div>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold m-0">📦 Sales Contribution by Main Category</h3>
      <button id="btnRefresh" class="btn btn-outline-primary btn-sm" onclick="fetchAndRenderData()">🔄 รีเฟรชข้อมูล</button>
    </div>

    <!-- ===== 2. ด้านบน: DONUT CHART CARD ===== -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-white fw-bold py-3">
        📊 สัดส่วนยอดขายตามหมวดหมู่หลัก (% Contribution)
      </div>
      <div class="card-body d-flex justify-content-center align-items-center" style="position: relative; height: 380px;">
        <canvas id="contributionDonutChart"></canvas>
      </div>
    </div>

    <!-- ===== 3. ด้านล่าง: GRID / TABLE CARD ===== -->
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white fw-bold py-3">
        📋 รายละเอียด Contribution แยกตาม Main Category
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th style="width: 50px;" class="text-center">#</th>
                <th>Main Category</th>
                <th class="text-end">ยอดขายรวม (บาท)</th>
                <th class="text-end" style="width: 200px;">สัดส่วน (% Contribution)</th>
              </tr>
            </thead>
            <tbody id="gridTbody">
              <tr>
                <td colspan="4" class="text-center py-4 text-muted">กำลังโหลดข้อมูล...</td>
              </tr>
            </tbody>
            <tfoot class="table-light fw-bold" id="gridTfoot">
              <!-- รวมทั้งหมดจะแสดงที่นี่ -->
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 4. SCRIPT SECTION ===== -->
  <script>
    // -------------------------------------------------------------
    // A. Dynamic โหลด Header กลาง
    // -------------------------------------------------------------
    async function loadHeader() {
      try {
        const res = await fetch('/uerp/uerpheader.html');
        if (res.ok) {
          document.getElementById('uerp-header-container').innerHTML = await res.text();
          const script = document.createElement('script');
          script.src = '/uerp/layoutuerp.js';
          document.body.appendChild(script);
        }
      } catch (err) {
        console.error('Failed to load header:', err);
      }
    }
    loadHeader();

    // -------------------------------------------------------------
    // B. Supabase Setup (ตั้งค่า Config ของคุณตรงนี้)
    // -------------------------------------------------------------
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let donutChartInstance = null; // เก็บตัวแปร Chart ไว้สำหรับ Destroy เมื่อโหลดใหม่

    // -------------------------------------------------------------
    // C. Function ดึงข้อมูลและคำนวณ % Contribution
    // -------------------------------------------------------------
    async function fetchAndRenderData() {
      try {
        // 1. ดึงข้อมูลจากตาราง transactions
        // (หมายเหตุ: เปลี่ยน total_amount เป็นชื่อคอลัมน์ยอดขายของคุณถ้าชื่อไม่ตรงกัน)
        const { data: transactions, error } = await supabaseClient
          .from('transactions')
          .select('maincategory, total_amount');

        if (error) throw error;

        // 2. จับกลุ่ม (Group By) ตาม maincategory และหาผลรวมยอดขายทั้งหมด
        let overallTotalSales = 0;
        const categoryTotals = {};

        transactions.forEach(row => {
          const category = row.maincategory || 'Uncategorized';
          const amount = Number(row.total_amount || 0);

          categoryTotals[category] = (categoryTotals[category] || 0) + amount;
          overallTotalSales += amount;
        });

        // 3. แปลงเป็น Array + คำนวณ % Contribution
        const contributionList = Object.keys(categoryTotals).map(cat => {
          const catSales = categoryTotals[cat];
          const percent = overallTotalSales > 0 ? (catSales / overallTotalSales) * 100 : 0;
          return {
            category: cat,
            sales: catSales,
            percent: percent
          };
        });

        // เรียงลำดับจากยอดขายมากไปน้อย
        contributionList.sort((a, b) => b.sales - a.sales);

        // 4. Render เข้า Donut Chart และ Grid Table
        renderDonutChart(contributionList);
        renderGridTable(contributionList, overallTotalSales);

      } catch (err) {
        console.error('Error fetching transactions:', err);
        alert('เกิดข้อผิดพลาดในการโหลดข้อมูล');
      }
    }

    // -------------------------------------------------------------
    // D. Render Donut Chart (% Contribution)
    // -------------------------------------------------------------
    function renderDonutChart(dataList) {
      const ctx = document.getElementById('contributionDonutChart').getContext('2d');

      const labels = dataList.map(item => item.category);
      const percents = dataList.map(item => item.percent.toFixed(2));

      // ลบ Chart เก่าก่อนวาดใหม่เมื่อกด Refresh
      if (donutChartInstance) {
        donutChartInstance.destroy();
      }

      donutChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: percents,
            backgroundColor: [
              '#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b',
              '#858796', '#5a5c69', '#6f42c1', '#fd7e14', '#20c997'
            ],
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right'
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return ` ${context.label}: ${context.parsed}%`;
                }
              }
            }
          }
        }
      });
    }

    // -------------------------------------------------------------
    // E. Render Grid Table
    // -------------------------------------------------------------
    function renderGridTable(dataList, overallTotalSales) {
      const tbody = document.getElementById('gridTbody');
      const tfoot = document.getElementById('gridTfoot');

      if (dataList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">ไม่พบข้อมูล</td></tr>`;
        tfoot.innerHTML = '';
        return;
      }

      // ตาราง Body
      tbody.innerHTML = dataList.map((item, index) => `
        <tr>
          <td class="text-center fw-bold text-secondary">${index + 1}</td>
          <td class="fw-semibold">${item.category}</td>
          <td class="text-end">${item.sales.toLocaleString('th-TH', { minimumFractionDigits: 2 })}</td>
          <td class="text-end fw-bold text-primary">${item.percent.toFixed(2)}%</td>
        </tr>
      `).join('');

      // ตาราง Foot (สรุปรวม)
      tfoot.innerHTML = `
        <tr>
          <td colspan="2" class="text-end fw-bold">ยอดรวมทั้งหมด:</td>
          <td class="text-end fw-bold text-dark">${overallTotalSales.toLocaleString('th-TH', { minimumFractionDigits: 2 })}</td>
          <td class="text-end fw-bold text-success">100.00%</td>
        </tr>
      `;
    }

    // เริ่มทำงานเมื่อเปิดหน้าเว็บ
    document.addEventListener('DOMContentLoaded', fetchAndRenderData);
  </script>
</body>
</html>
