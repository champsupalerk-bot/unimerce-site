<head>

<title>UNIMERCE | Shipping Label</title>

<style>
*{
    box-sizing:border-box;
    font-family:"Kanit",Arial,sans-serif
}

html,body{
    margin:0;
    padding:0;
    background:#fff;
    color:#111827
}

body{
    padding-top:80px;
    overflow-x:hidden
}

.container{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    padding:0 16px
}

.page-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    margin:20px 0 14px
}

.page-title{
    font-size:22px;
    font-weight:600;
    color:#111827;
    line-height:1.3
}

.page-subtitle{
    font-size:13px;
    color:#777;
    margin-top:2px
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap
}

.btn{
    border:1px solid #d1d5db;
    background:#fff;
    color:#374151;
    border-radius:7px;
    padding:8px 14px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    position:relative;
    z-index:1
}

.btn:hover{
    background:#f8fafc
}

.btn-primary{
    background:#1a73e8;
    color:#fff;
    border-color:#1a73e8
}

.btn-primary:hover{
    background:#1769d1
}

.btn-dark{
    background:#111827;
    color:#fff;
    border-color:#111827
}

.status{
    padding:9px 12px;
    border-radius:7px;
    background:#eef6ff;
    border:1px solid #cfe4ff;
    color:#185abc;
    font-size:13px;
    margin-bottom:14px
}

.status.error{
    background:#fff1f2;
    border-color:#fecdd3;
    color:#be123c
}

.hidden{
    display:none!important
}

/* Desktop layout */
.workspace{
    display:grid;
    grid-template-columns:300px 400px;
    gap:20px;
    align-items:start;
    justify-content:start;
    padding-bottom:40px
}

.editor{
    border:1px solid #e1e5eb;
    border-radius:10px;
    padding:16px;
    background:#fff
}

.editor-title{
    font-size:15px;
    font-weight:600;
    margin-bottom:14px
}

.field{
    margin-bottom:12px
}

.field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:#4b5563;
    margin-bottom:5px
}

.field input,
.field textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:6px;
    padding:8px 9px;
    font-size:13px;
    color:#111827;
    outline:none;
    background:#fff
}

.field textarea{
    resize:vertical;
    min-height:70px
}

.field input:focus,
.field textarea:focus{
    border-color:#1a73e8;
    box-shadow:0 0 0 2px rgba(26,115,232,.08)
}

.hint{
    font-size:11px;
    color:#9ca3af;
    line-height:1.5;
    margin-top:6px
}

.paper-wrap{
    display:flex;
    justify-content:flex-start;
    align-items:flex-start
}

.sticker-paper{
    width:100mm;
    height:150mm;
    background:#fff;
    box-shadow:0 4px 20px rgba(15,23,42,.15);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    flex-shrink:0
}

.shipping-label{
    width:100mm;
    height:150mm;
    background:#fff;
    color:#111827;
    padding:2.5mm 2.7mm 2mm;
    display:flex;
    flex-direction:column;
    overflow:hidden
}

.label-header{
    display:grid;
    grid-template-columns:54% 46%;
    gap:2mm;
    padding-bottom:2mm;
    border-bottom:1px solid #111827;
    flex-shrink:0
}

.brand-area{
    min-width:0
}

.logo{
    width:38mm;
    height:9mm;
    object-fit:contain;
    object-position:left center;
    display:block;
    margin-bottom:1.2mm
}

.warehouse{
    font-size:7.2px;
    line-height:1.35;
    color:#374151;
    padding-right:1mm
}

.tracking-area{
    text-align:right;
    min-width:0;
    padding-top:.5mm
}

.label-caption{
    font-size:7px;
    font-weight:700;
    letter-spacing:.5px;
    color:#6b7280;
    margin-bottom:.4mm
}

.tracking-number{
    font-family:"Courier New",monospace;
    font-size:16px;
    line-height:1.05;
    font-weight:800;
    word-break:break-all;
    overflow-wrap:anywhere;
    margin-bottom:1mm
}

.barcode-box{
    display:flex;
    justify-content:flex-end;
    overflow:hidden;
    min-height:0
}

.barcode-box svg{
    max-width:100%;
    height:auto;
    display:block
}

.section{
    margin-top:2.2mm;
    flex-shrink:0
}

.section-title{
    font-size:7.5px;
    font-weight:700;
    letter-spacing:.5px;
    color:#6b7280;
    padding-bottom:.7mm;
    border-bottom:.6px solid #cbd5e1;
    margin-bottom:1.2mm
}

.customer-grid{
    display:grid;
    grid-template-columns:23mm 1fr;
    column-gap:2mm;
    row-gap:.7mm;
    font-size:10.2px;
    line-height:1.25
}

.customer-label{
    color:#6b7280;
    font-weight:600;
    font-size:7.5px;
    padding-top:.4mm
}

.customer-value{
    min-width:0;
    word-break:break-word;
    overflow-wrap:anywhere;
    font-weight:500
}

.customer-address{
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:3;
    overflow:hidden
}

.customer-name{
    font-size:11.5px;
    font-weight:600
}

.order-section{
    margin-top:2.2mm;
    padding-top:1.8mm;
    border-top:1px solid #111827;
    flex-shrink:0
}

.order-title-row{
    display:flex;
    justify-content:flex-start;
    align-items:center
}

.order-number{
    font-family:"Courier New",monospace;
    font-size:16px;
    line-height:1.15;
    font-weight:800;
    word-break:break-all;
    overflow-wrap:anywhere;
    margin-bottom:1.3mm;
    text-align:left
}

.order-barcode{
    justify-content:flex-start
}

.order-barcode svg{
    max-width:82mm
}

.items-section{
    margin-top:2.3mm;
    flex-shrink:0;
    min-height:0
}

.items-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    font-size:9px
}

.items-table th{
    font-size:7px;
    color:#6b7280;
    font-weight:700;
    text-align:left;
    padding:.8mm .7mm;
    border-bottom:.7px solid #9ca3af
}

.items-table td{
    padding:1mm .7mm;
    vertical-align:top;
    border-bottom:.4px solid #e5e7eb;
    line-height:1.25
}

.items-table th:nth-child(1),
.items-table td:nth-child(1){
    width:21mm
}

.items-table th:nth-child(2),
.items-table td:nth-child(2){
    width:auto
}

.items-table th:nth-child(3),
.items-table td:nth-child(3){
    width:10mm;
    text-align:right
}

.item-code{
    font-family:"Courier New",monospace;
    font-weight:700;
    font-size:8.5px;
    word-break:break-all
}

.item-name{
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    overflow:hidden;
    word-break:break-word
}

.qty{
    font-weight:800;
    font-size:10px
}

.items-table.compact{
    font-size:8px
}

.items-table.compact td{
    padding:.7mm .6mm
}

.items-table.compact .item-name{
    -webkit-line-clamp:1
}

.remark-section{
    margin-top:2mm;
    flex-shrink:0
}

.remark-box{
    min-height:8mm;
    max-height:13mm;
    border:.7px solid #9ca3af;
    padding:1.4mm;
    font-size:9px;
    line-height:1.25;
    white-space:pre-wrap;
    word-break:break-word;
    overflow:hidden
}

.label-footer{
    margin-top:auto;
    padding-top:1.8mm;
    border-top:.6px solid #d1d5db;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:3mm;
    flex-shrink:0
}

.invoice-ref{
    font-family:"Courier New",monospace;
    font-size:7.5px;
    color:#6b7280
}

.website{
    font-size:11px;
    font-weight:700;
    color:#111827;
    white-space:nowrap
}

.empty-message{
    text-align:center;
    padding:30px 15px;
    color:#6b7280;
    font-size:13px
}

/* Tablet / Mobile */
@media(max-width:800px){

    body{
        padding-top:70px
    }

    .container{
        padding:0 12px
    }

    .page-top{
        align-items:flex-start;
        flex-direction:column
    }

    .actions{
        width:100%
    }

    .actions .btn{
        flex:1
    }

    .workspace{
        grid-template-columns:1fr;
        gap:18px
    }

    .editor{
        order:1
    }

    .paper-wrap{
        order:2;
        overflow-x:auto;
        justify-content:flex-start;
        padding-bottom:20px
    }
}

/* Print */
@media print{

    html,body{
        background:#fff
    }

    body{
        padding-top:0
    }

    #headerContainer,
    .page-top,
    .status,
    .editor{
        display:none!important
    }

    .container{
        max-width:none;
        padding:0;
        margin:0
    }

    .workspace{
        display:block;
        padding:0;
        margin:0
    }

    .paper-wrap{
        display:block
    }

    .sticker-paper{
        box-shadow:none;
        margin:0
    }

    @page{
        size:100mm 150mm;
        margin:0
    }
}
</style>
</head>

<body>

<!-- Header จะถูก inject หลังหน้าและ asset หลักโหลดเสร็จ -->
<div id="headerContainer"></div>

<main class="container">

        <div>

        </div>

<script>

const supabaseUrl = "https://xygdmszernmircmbqwke.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5Z2Rtc3plcm5taXJjbWJxd2tlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NTY5NTAsImV4cCI6MjA5NzIzMjk1MH0.Qcq5h2TignXwhsyOe8IYcMYvlayyTjH66tTiPznVOOY";

const supabaseClient = supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const warehouseText =
    "UNIMERCE คลังสินค้า 425 ปากซอยลาดพร้าววังหิน55(ไม่เข้าซอย) ถนนลาดพร้าววังหิน แขวงลาดพร้าว เขตลาดพร้าว กรุงเทพ 10230, โทร 0812568704";

let invoiceNo = "";
let transactionRows = [];


/* =========================================================
   HEADER
   โหลดเป็นขั้นตอนสุดท้าย หลังหน้าและ asset หลักพร้อมแล้ว
========================================================= */

async function loadHeader(){

    try{

        const res = await fetch("uerpheader.html", {
            cache:"no-cache"
        });

        if(!res.ok){
            throw new Error("Header file not found");
        }

        const html = await res.text();

        const headerContainer =
            document.getElementById("headerContainer");

        headerContainer.innerHTML = html;

        /*
         * Reset layout state ก่อน init ใหม่
         * เพื่อป้องกัน layoutuerp.js คิดว่าถูก initialize ไปแล้ว
         */
        if(typeof window.initUerpLayout === "function"){

            window.__uerpLayoutInitialized = false;

            window.initUerpLayout();

        }

    }catch(err){

        console.warn(
            "Header load error:",
            err
        );

    }

}


/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getUrlInvoiceNo(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("invoice_no") || ""
    ).trim();

}


function showStatus(message,isError=false){

    const el =
        document.getElementById("status");

    el.textContent = message;

    el.classList.remove(
        "hidden",
        "error"
    );

    if(isError){
        el.classList.add("error");
    }

}


function hideStatus(){

    document
        .getElementById("status")
        .classList.add("hidden");

}


function firstValue(rows,fields){

    for(const field of fields){

        const row =
            rows.find(
                item =>
                    item[field] !== null &&
                    item[field] !== undefined &&
                    String(item[field]).trim() !== ""
            );

        if(row){
            return String(row[field]);
        }

    }

    return "";

}


function formatQty(value){

    const num = Number(value);

    if(Number.isNaN(num)){
        return value || "";
    }

    return Number.isInteger(num)
        ? num.toString()
        : num.toLocaleString(
            "en-US",
            {
                maximumFractionDigits:3
            }
        );

}


/* =========================================================
   LOAD TRANSACTION
========================================================= */

function loadTransaction(){

    invoiceNo = getUrlInvoiceNo();

    if(!invoiceNo){

        showStatus(
            "ไม่พบ invoice_no ใน URL",
            true
        );

        document.getElementById(
            "shippingLabel"
        ).innerHTML =
            '<div class="empty-message">ไม่พบ Invoice No.</div>';

        return;
    }

    showStatus(
        `กำลังโหลด Invoice ${invoiceNo}...`
    );

    supabaseClient
        .from("transactions")
        .select(`
            date,
            invoice_no,
            name,
            address,
            order_no,
            tracking_number,
            item_code,
            item_name,
            qty,
            channel,
            remark,
            customer_code,
            customer_name,
            customer_address,
            tax_id,
            phone,
            email,
            delivery_method
        `)
        .eq("invoice_no",invoiceNo)
        .order(
            "invoice_item_id",
            {
                ascending:true
            }
        )
        .then(({data,error})=>{

            if(error){
                throw error;
            }

            transactionRows = data || [];

            if(transactionRows.length === 0){

                showStatus(
                    `ไม่พบข้อมูล Invoice ${invoiceNo}`,
                    true
                );

                document.getElementById(
                    "shippingLabel"
                ).innerHTML =
                    `<div class="empty-message">
                        ไม่พบข้อมูลรายการ<br>
                        Invoice No. ${escapeHtml(invoiceNo)}
                    </div>`;

                return;
            }

            fillCustomerFields();

            renderLabel();

            hideStatus();

        })
        .catch(error=>{

            console.error(
                "Shipping Label Error:",
                error
            );

            showStatus(
                `เกิดข้อผิดพลาด: ${error.message}`,
                true
            );

        });

}


/* =========================================================
   CUSTOMER FIELDS
========================================================= */

function fillCustomerFields(){

    document.getElementById("customerCode").value =
        firstValue(
            transactionRows,
            ["customer_code"]
        );

    document.getElementById("customerName").value =
        firstValue(
            transactionRows,
            ["customer_name","name"]
        );

    document.getElementById("customerAddress").value =
        firstValue(
            transactionRows,
            ["customer_address","address"]
        );

    document.getElementById("taxId").value =
        firstValue(
            transactionRows,
            ["tax_id"]
        );

    document.getElementById("phone").value =
        firstValue(
            transactionRows,
            ["phone"]
        );

    document.getElementById("email").value =
        firstValue(
            transactionRows,
            ["email"]
        );

    document.getElementById("remark").value =
        firstValue(
            transactionRows,
            ["remark"]
        );

}


/* =========================================================
   RENDER LABEL
========================================================= */

function renderLabel(){

    const customerCode =
        document.getElementById("customerCode").value.trim();

    const customerName =
        document.getElementById("customerName").value.trim();

    const customerAddress =
        document.getElementById("customerAddress").value.trim();

    const taxId =
        document.getElementById("taxId").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const remark =
        document.getElementById("remark").value.trim();

    const trackingNumber =
        firstValue(
            transactionRows,
            ["tracking_number"]
        );

    const orderNo =
        firstValue(
            transactionRows,
            ["order_no"]
        );

    let itemsHtml = "";

    transactionRows.forEach(row=>{

        itemsHtml += `
            <tr>
                <td>
                    <span class="item-code">
                        ${escapeHtml(row.item_code || "-")}
                    </span>
                </td>

                <td>
                    <span class="item-name">
                        ${escapeHtml(row.item_name || "-")}
                    </span>
                </td>

                <td>
                    <span class="qty">
                        ${escapeHtml(formatQty(row.qty))}
                    </span>
                </td>
            </tr>
        `;

    });

    const compactClass =
        transactionRows.length > 6
            ? "compact"
            : "";

    const label =
        document.getElementById(
            "shippingLabel"
        );

    label.innerHTML = `

        <div class="label-header">

            <div class="brand-area">

                <img
                    id="labelLogo"
                    class="logo"
                    crossorigin="anonymous"
                    src="https://res.cloudinary.com/dzgaej1wo/image/upload/v1787898744/ULOGO_CLEAR_800_iyninb.png"
                    alt="UNIMERCE"
                >

                <div class="warehouse">
                    ${escapeHtml(warehouseText)}
                </div>

            </div>

            <div class="tracking-area">

                <div class="label-caption">
                    TRACKING NO.
                </div>

                <div class="tracking-number">
                    ${escapeHtml(trackingNumber || "-")}
                </div>

                ${
                    trackingNumber
                    ? `
                        <div class="barcode-box">
                            <svg id="trackingBarcode"></svg>
                        </div>
                    `
                    : ""
                }

            </div>

        </div>


        <div class="section">

            <div class="section-title">
                SHIP TO
            </div>

            <div class="customer-grid">

                <div class="customer-label">
                    CUSTOMER CODE
                </div>

                <div class="customer-value">
                    ${escapeHtml(customerCode || "-")}
                </div>


                <div class="customer-label">
                    NAME
                </div>

                <div class="customer-value customer-name">
                    ${escapeHtml(customerName || "-")}
                </div>


                <div class="customer-label">
                    ADDRESS
                </div>

                <div class="customer-value customer-address">
                    ${escapeHtml(customerAddress || "-")}
                </div>


                ${
                    taxId
                    ? `
                        <div class="customer-label">
                            TAX ID
                        </div>

                        <div class="customer-value">
                            ${escapeHtml(taxId)}
                        </div>
                    `
                    : ""
                }


                ${
                    phone
                    ? `
                        <div class="customer-label">
                            TEL
                        </div>

                        <div class="customer-value">
                            ${escapeHtml(phone)}
                        </div>
                    `
                    : ""
                }


                ${
                    email
                    ? `
                        <div class="customer-label">
                            EMAIL
                        </div>

                        <div class="customer-value">
                            ${escapeHtml(email)}

    `;

    generateBarcodes();

}


/* =========================================================
   BARCODE
========================================================= */

function generateBarcodes(){

    const tracking =
        firstValue(
            transactionRows,
            ["tracking_number"]
        );

    const orderNo =
        firstValue(
            transactionRows,
            ["order_no"]
        );


    if(
        tracking &&
        document.getElementById(
            "trackingBarcode"
        )
    ){

        try{

            JsBarcode(
                "#trackingBarcode",
                tracking,
                {
                    format:"CODE128",
                    width:1.25,
                    height:30,
                    displayValue:false,
                    margin:1,
                    background:"#ffffff",
                    lineColor:"#111827"
                }
            );

        }catch(error){

            console.warn(
                "Tracking barcode error:",
                error
            );

        }

    }


    if(
        orderNo &&
        document.getElementById(
            "orderBarcode"
        )
    ){

        try{

            JsBarcode(
                "#orderBarcode",
                orderNo,
                {
                    format:"CODE128",
                    width:1.15,
                    height:30,
                    displayValue:false,
                    margin:1,
                    background:"#ffffff",
                    lineColor:"#111827"
                }
            );

        }catch(error){

            console.warn(
                "Order barcode error:",
                error
            );

        }

    }

}

/* =========================================================
   CAPTURE
========================================================= */

async function captureLabel(scale=3){

    const label =
        document.getElementById(
            "shippingLabel"
        );

    await document.fonts.ready;

    await new Promise(
        resolve =>
            setTimeout(resolve,150)
    );

    return await html2canvas(
        label,
        {
            scale:scale,
            useCORS:true,
            allowTaint:false,
            backgroundColor:"#ffffff",
            logging:false
        }
    );

}


/* =========================================================
   SAVE FILE
========================================================= */

function saveBlob(blob,filename){

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(
        ()=>URL.revokeObjectURL(url),
        1000
    );

}


/* =========================================================
   JPEG
========================================================= */

async function generateJPEG(){

    try{

        showStatus(
            "กำลังสร้าง JPEG..."
        );

        const canvas =
            await captureLabel(3);

        let quality = .9;

        let dataUrl =
            canvas.toDataURL(
                "image/jpeg",
                quality
            );

        while(
            dataUrl.length > 200 * 1024 * 1.37 &&
            quality > .55
        ){

            quality -= .03;

            dataUrl =
                canvas.toDataURL(
                    "image/jpeg",
                    quality
                );

        }

        const blob =
            await fetch(dataUrl)
                .then(r=>r.blob());

        saveBlob(
            blob,
            `UNIMERCE_${invoiceNo}.jpg`
        );

        showStatus(
            `สร้าง JPEG แล้ว ขนาด ${Math.round(blob.size / 1024)} KB`
        );

        setTimeout(
            hideStatus,
            2000
        );

    }catch(error){

        console.error(
            "JPEG Error:",
            error
        );

        showStatus(
            `สร้าง JPEG ไม่สำเร็จ: ${error.message}`,
            true
        );

    }

}


/* =========================================================
   PDF
========================================================= */

async function generatePDF(){

    try{

        showStatus(
            "กำลังสร้าง PDF..."
        );

        const canvas =
            await captureLabel(3);

        const {jsPDF} =
            window.jspdf;

        let quality = .9;

        let imageData =
            canvas.toDataURL(
                "image/jpeg",
                quality
            );

        let pdf =
            new jsPDF({
                orientation:"portrait",
                unit:"mm",
                format:[100,150],
                compress:true
            });

        pdf.addImage(
            imageData,
            "JPEG",
            0,
            0,
            100,
            150,
            undefined,
            "FAST"
        );

        let blob =
            pdf.output("blob");


        while(
            blob.size > 200 * 1024 &&
            quality > .55
        ){

            quality -= .03;

            imageData =
                canvas.toDataURL(
                    "image/jpeg",
                    quality
                );

            pdf =
                new jsPDF({
                    orientation:"portrait",
                    unit:"mm",
                    format:[100,150],
                    compress:true
                });

            pdf.addImage(
                imageData,
                "JPEG",
                0,
                0,
                100,
                150,
                undefined,
                "FAST"
            );

            blob =
                pdf.output("blob");

        }


        saveBlob(
            blob,
            `UNIMERCE_${invoiceNo}.pdf`
        );

        const sizeKB =
            Math.round(
                blob.size / 1024
            );

        showStatus(
            `สร้าง PDF แล้ว ขนาด ${sizeKB} KB`
        );

        setTimeout(
            hideStatus,
            2500
        );

    }catch(error){

        console.error(
            "PDF Error:",
            error
        );

        showStatus(
            `สร้าง PDF ไม่สำเร็จ: ${error.message}`,
            true
        );

    }

}
