<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=99">

<title>UNIMERCE | Shipping Label</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="/layoutuerp.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="/barcode-label-engine.js"></script>

<style>
*{
  box-sizing:border-box;
  font-family:"Kanit",Arial,sans-serif;
}

html,body{
  margin:0;
  padding:0;
  background:#fff;
  color:#111827;
}

body{
  padding-top:80px;
  overflow-x:hidden;
}

.container{
  max-width:1000px;
  margin:0 auto;
  padding:0 16px;
}

.page-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin:20px 0 14px;
}

.page-title{
  font-size:22px;
  font-weight:600;
  color:#111827;
  line-height:1.3;
}

.page-subtitle{
  font-size:13px;
  color:#777;
  margin-top:2px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid #d1d5db;
  background:#fff;
  color:#374151;
  border-radius:7px;
  padding:8px 14px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
}

.btn:hover{
  background:#f8fafc;
}

.btn-primary{
  background:#1a73e8;
  color:#fff;
  border-color:#1a73e8;
}

.btn-primary:hover{
  background:#1769d1;
}

.btn-dark{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.status{
  padding:9px 12px;
  border-radius:7px;
  background:#eef6ff;
  border:1px solid #cfe4ff;
  color:#185abc;
  font-size:13px;
  margin-bottom:14px;
}

.status.error{
  background:#fff1f2;
  border-color:#fecdd3;
  color:#be123c;
}

.hidden{
  display:none!important;
}

.workspace{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:24px;
  align-items:start;
  padding-bottom:40px;
}

.editor{
  border:1px solid #e1e5eb;
  border-radius:10px;
  padding:16px;
  background:#fff;
}

.editor-title{
  font-size:15px;
  font-weight:600;
  margin-bottom:14px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:#4b5563;
  margin-bottom:5px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:6px;
  padding:8px 9px;
  font-size:13px;
  color:#111827;
  outline:none;
  background:#fff;
}

.field textarea{
  resize:vertical;
  min-height:70px;
}

.field input:focus,
.field textarea:focus{
  border-color:#1a73e8;
  box-shadow:0 0 0 2px rgba(26,115,232,.08);
}

.hint{
  font-size:11px;
  color:#9ca3af;
  line-height:1.5;
  margin-top:6px;
}

.paper-wrap{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.sticker-paper{
  width:100mm;
  height:150mm;
  background:#fff;
  box-shadow:0 4px 20px rgba(15,23,42,.15);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  flex-shrink:0;
}

/* =========================================================
   PRINT LABEL
   ========================================================= */

.shipping-label{
  width:100mm;
  height:150mm;
  background:#fff;
  color:#111827;

  /* เพิ่ม margin เพื่อกันตกขอบเครื่องพิมพ์ */
  padding:4mm 4mm 3.5mm;

  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================================================
   HEADER
   ========================================================= */

.label-header{
  display:grid;
  grid-template-columns:55% 45%;
  gap:2mm;

  padding-bottom:2.5mm;
  border-bottom:1px solid #111827;

  flex-shrink:0;
}

.brand-area{
  min-width:0;
}

/*
  แก้ปัญหา logo เหยียดตอน html2canvas / PDF
  ใช้ width + height:auto แทนการบังคับ width/height พร้อมกัน
*/
.logo{
  display:block;

  width:auto;
  height:9mm;

  max-width:42mm;
  max-height:9mm;

  object-fit:contain;
  object-position:left center;

  margin-bottom:1.2mm;
}

.warehouse{
  font-size:7.2px;
  line-height:1.35;
  color:#374151;
  padding-right:1mm;
}

.order-top{
  text-align:right;
  min-width:0;
  padding-top:.5mm;
}

.label-caption{
  font-size:7px;
  font-weight:700;
  letter-spacing:.5px;
  color:#6b7280;
  margin-bottom:.4mm;
}

.order-number-top{
  font-family:"Courier New",monospace;
  font-size:15px;
  line-height:1.05;
  font-weight:800;

  word-break:break-all;
  overflow-wrap:anywhere;

  text-align:right;
}

/* =========================================================
   TRACKING + QR
   ========================================================= */

.tracking-section{
  margin-top:2.5mm;
  padding-bottom:2.5mm;

  border-bottom:1px solid #111827;

  display:grid;
  grid-template-columns:1fr 22mm;
  gap:3mm;

  align-items:center;

  flex-shrink:0;
}

.tracking-main{
  min-width:0;
}

.tracking-number{
  font-family:"Courier New",monospace;
  font-size:15px;
  line-height:1.05;
  font-weight:800;

  word-break:break-all;
  overflow-wrap:anywhere;

  margin-bottom:1.5mm;
}

.barcode-box{
  display:flex;
  justify-content:flex-start;
  overflow:hidden;
  min-height:0;
}

.barcode-box svg{
  max-width:100%;
  height:auto;
  display:block;
}

.tracking-qr{
  width:22mm;
  height:22mm;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.tracking-qr img,
.tracking-qr canvas{
  width:22mm!important;
  height:22mm!important;
  display:block;
}

/* =========================================================
   SECTION
   ========================================================= */

.section{
  margin-top:2.2mm;
  flex-shrink:0;
}

.section-title{
  font-size:7.5px;
  font-weight:700;
  letter-spacing:.5px;
  color:#6b7280;

  padding-bottom:.7mm;
  border-bottom:.6px solid #cbd5e1;

  margin-bottom:1.2mm;
}

/* =========================================================
   CUSTOMER
   ========================================================= */

.customer-grid{
  display:grid;
  grid-template-columns:23mm 1fr;

  column-gap:2mm;
  row-gap:.7mm;

  font-size:10.2px;
  line-height:1.25;
}

.customer-label{
  color:#6b7280;
  font-weight:600;
  font-size:7.5px;
  padding-top:.4mm;
}

.customer-value{
  min-width:0;
  word-break:break-word;
  overflow-wrap:anywhere;
  font-weight:500;
}

.customer-address{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  overflow:hidden;
}

.customer-name{
  font-size:11.5px;
  font-weight:600;
}

/* =========================================================
   ITEMS
   ========================================================= */

.items-section{
  margin-top:2.3mm;
  flex-shrink:0;
  min-height:0;
}

.items-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:9px;
}

.items-table th{
  font-size:7px;
  color:#6b7280;
  font-weight:700;
  text-align:left;

  padding:.8mm .7mm;

  border-bottom:.7px solid #9ca3af;
}

.items-table td{
  padding:1mm .7mm;
  vertical-align:top;

  border-bottom:.4px solid #e5e7eb;

  line-height:1.25;
}

.items-table th:nth-child(1),
.items-table td:nth-child(1){
  width:21mm;
}

.items-table th:nth-child(2),
.items-table td:nth-child(2){
  width:auto;
}

.items-table th:nth-child(3),
.items-table td:nth-child(3){
  width:10mm;
  text-align:right;
}

.item-code{
  font-family:"Courier New",monospace;
  font-weight:700;
  font-size:8.5px;

  word-break:break-all;
}

.item-name{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;

  overflow:hidden;
  word-break:break-word;
}

.qty{
  font-weight:800;
  font-size:10px;
}

.items-table.compact{
  font-size:8px;
}

.items-table.compact td{
  padding:.7mm .6mm;
}

.items-table.compact .item-name{
  -webkit-line-clamp:1;
}

/* =========================================================
   REMARK
   ========================================================= */

.remark-section{
  margin-top:2mm;
  flex-shrink:0;
}

.remark-box{
  min-height:8mm;
  max-height:13mm;

  border:.7px solid #9ca3af;

  padding:1.4mm;

  font-size:9px;
  line-height:1.25;

  white-space:pre-wrap;
  word-break:break-word;

  overflow:hidden;
}

/* =========================================================
   FOOTER
   ========================================================= */

.label-footer{
  margin-top:auto;

  padding-top:1.8mm;

  border-top:.6px solid #d1d5db;

  display:flex;
  justify-content:space-between;
  align-items:flex-end;

  gap:3mm;

  flex-shrink:0;
}

.footer-left{
  min-width:0;
}

.invoice-ref{
  font-family:"Courier New",monospace;

  /* เพิ่มจาก 7.5px */
  font-size:9.5px;

  font-weight:700;

  color:#374151;

  line-height:1.2;
}

.support{
  font-size:7.5px;
  color:#6b7280;

  margin-top:.7mm;

  white-space:nowrap;
}

.website{
  font-size:10px;
  font-weight:700;
  color:#111827;
  white-space:nowrap;
}

.empty-message{
  text-align:center;
  padding:30px 15px;
  color:#6b7280;
  font-size:13px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:800px){

  body{
    padding-top:70px;
  }

  .container{
    padding:0 12px;
  }

  .page-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .workspace{
    grid-template-columns:1fr;
    gap:18px;
  }

  .editor{
    order:1;
  }

  .paper-wrap{
    order:2;
    overflow-x:auto;
    justify-content:flex-start;
    padding-bottom:20px;
  }
}

/* =========================================================
   PRINT
   ========================================================= */

@media print{

  html,
  body{
    background:#fff;
  }

  body{
    padding-top:0;
  }

  #headerContainer,
  .page-top,
  .status,
  .editor{
    display:none!important;
  }

  .container{
    max-width:none;
    padding:0;
    margin:0;
  }

  .workspace{
    display:block;
    padding:0;
    margin:0;
  }

  .paper-wrap{
    display:block;
  }

  .sticker-paper{
    box-shadow:none;
    margin:0;
  }

  @page{
    size:100mm 150mm;
    margin:0;
  }
}
</style>
</head>

<body>

<div id="headerContainer"></div>

<main class="container">

  <div class="page-top">

    <div>
      <div class="page-title">UNIMERCE Shipping Label</div>
      <div class="page-subtitle">Shipping Label · 100 × 150 mm</div>
    </div>

    <div class="actions">
      <button class="btn" onclick="window.print()">Print</button>
      <button class="btn btn-primary" onclick="generatePDF()">Generate PDF</button>
      <button class="btn btn-dark" onclick="generateJPEG()">Generate JPEG</button>
    </div>

  </div>

  <div id="status" class="status hidden"></div>

  <div class="workspace">

    <div class="editor">

      <div class="editor-title">Shipping Information</div>

      <div class="field">
        <label>Customer Code</label>
        <input id="customerCode">
      </div>

      <div class="field">
        <label>Customer Name</label>
        <input id="customerName">
      </div>

      <div class="field">
        <label>Customer Address</label>
        <textarea id="customerAddress"></textarea>
      </div>

      <div class="field">
        <label>Tax ID</label>
        <input id="taxId">
      </div>

      <div class="field">
        <label>Phone</label>
        <input id="phone">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="email">
      </div>

      <div class="field">
        <label>Remark</label>
        <textarea id="remark" placeholder="หมายเหตุสำหรับการจัดส่ง..."></textarea>
      </div>

      <div class="hint">
        ข้อมูลลูกค้าสามารถแก้ไขได้ก่อน Generate PDF/JPEG โดยจะยังไม่บันทึกกลับเข้า Supabase
      </div>

    </div>

    <div class="paper-wrap">

      <div class="sticker-paper">

        <div id="shippingLabel" class="shipping-label">
          <div class="empty-message">กำลังโหลดข้อมูล...</div>
        </div>

      </div>

    </div>

  </div>

</main>

<script>

const supabaseUrl="https://xygdmszernmircmbqwke.supabase.co";

const supabaseKey="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmxlIiwicmVmIjoieHlnZG1zemVybm1pcmNtYnF3a2UifQ";

const supabaseClient=supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const warehouseText=
"UNIMERCE คลังสินค้า 425 ปากซอยลาดพร้าววังหิน55(ไม่เข้าซอย) ถนนลาดพร้าววังหิน แขวงลาดพร้าว เขตลาดพร้าว กรุงเทพ 10230, โทร 0812568704";

let invoiceNo="";
let transactionRows=[];

/* =========================================================
   HEADER
   ========================================================= */

function loadHeader(){

  const paths=[
    "/uerpheader.html",
    "/header.html",
    "uerpheader.html"
  ];

  async function tryLoad(index){

    if(index>=paths.length){
      console.warn("Header file not found");
      return;
    }

    try{

      const res=await fetch(paths[index],{
        cache:"no-cache"
      });

      if(!res.ok){
        throw new Error(`${res.status} ${res.statusText}`);
      }

      const html=await res.text();

      const headerContainer=
        document.getElementById("headerContainer");

      headerContainer.innerHTML=html;

      if(typeof window.initUerpLayout==="function"){

        window.__uerpLayoutInitialized=false;

        window.initUerpLayout();
      }

      return;

    }catch(error){

      console.warn(
        `Header load failed: ${paths[index]}`,
        error
      );

      return tryLoad(index+1);
    }
  }

  tryLoad(0);
}

/* =========================================================
   UTILITIES
   ========================================================= */

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getUrlInvoiceNo(){

  const params=
    new URLSearchParams(window.location.search);

  return(
    params.get("invoice_no")||""
  ).trim();
}

function showStatus(message,isError=false){

  const el=
    document.getElementById("status");

  el.textContent=message;

  el.classList.remove(
    "hidden",
    "error"
  );

  if(isError){
    el.classList.add("error");
  }
}

function hideStatus(){

  document
    .getElementById("status")
    .classList.add("hidden");
}

function firstValue(rows,fields){

  for(const field of fields){

    const row=
      rows.find(item=>
        item[field]!==null &&
        item[field]!==undefined &&
        String(item[field]).trim()!=""
      );

    if(row){
      return String(row[field]);
    }
  }

  return "";
}

function formatQty(value){

  const num=Number(value);

  if(Number.isNaN(num)){
    return value||"";
  }

  return Number.isInteger(num)
    ? num.toString()
    : num.toLocaleString(
        "en-US",
        {
          maximumFractionDigits:3
        }
      );
}

/* =========================================================
   LOAD TRANSACTION
   ========================================================= */

function loadTransaction(){

  invoiceNo=getUrlInvoiceNo();

  if(!invoiceNo){

    showStatus(
      "ไม่พบ invoice_no ใน URL",
      true
    );

    document
      .getElementById("shippingLabel")
      .innerHTML=
        '<div class="empty-message">ไม่พบ Invoice No.</div>';

    return;
  }

  showStatus(
    `กำลังโหลด Invoice ${invoiceNo}...`
  );

  supabaseClient
    .from("transactions")
    .select(`
      date,
      invoice_no,
      name,
      address,
      order_no,
      tracking_number,
      item_code,
      item_name,
      qty,
      channel,
      remark,
      customer_code,
      customer_name,
      customer_address,
      tax_id,
      phone,
      email,
      delivery_method
    `)
    .eq("invoice_no",invoiceNo)
    .order(
      "invoice_item_id",
      {
        ascending:true
      }
    )
    .then(({data,error})=>{

      if(error){
        throw error;
      }

      transactionRows=data||[];

      if(transactionRows.length===0){

        showStatus(
          `ไม่พบข้อมูล Invoice ${invoiceNo}`,
          true
        );

        document
          .getElementById("shippingLabel")
          .innerHTML=
            `<div class="empty-message">
              ไม่พบข้อมูลรายการ<br>
              Invoice No. ${escapeHtml(invoiceNo)}
            </div>`;

        return;
      }

      fillCustomerFields();

      renderLabel();

      hideStatus();

    })
    .catch(error=>{

      console.error(
        "Shipping Label Error:",
        error
      );

      showStatus(
        `เกิดข้อผิดพลาด: ${error.message}`,
        true
      );
    });
}

/* =========================================================
   CUSTOMER
   ========================================================= */

function fillCustomerFields(){

  document.getElementById("customerCode").value=
    firstValue(
      transactionRows,
      ["customer_code"]
    );

  document.getElementById("customerName").value=
    firstValue(
      transactionRows,
      [
        "customer_name",
        "name"
      ]
    );

  document.getElementById("customerAddress").value=
    firstValue(
      transactionRows,
      [
        "customer_address",
        "address"
      ]
    );

  document.getElementById("taxId").value=
    firstValue(
      transactionRows,
      ["tax_id"]
    );

  document.getElementById("phone").value=
    firstValue(
      transactionRows,
      ["phone"]
    );

  document.getElementById("email").value=
    firstValue(
      transactionRows,
      ["email"]
    );

  document.getElementById("remark").value=
    firstValue(
      transactionRows,
      ["remark"]
    );
}

/* =========================================================
   RENDER LABEL
   ========================================================= */

function renderLabel(){

  const customerCode=
    document.getElementById("customerCode")
      .value.trim();

  const customerName=
    document.getElementById("customerName")
      .value.trim();

  const customerAddress=
    document.getElementById("customerAddress")
      .value.trim();

  const taxId=
    document.getElementById("taxId")
      .value.trim();

  const phone=
    document.getElementById("phone")
      .value.trim();

  const email=
    document.getElementById("email")
      .value.trim();

  const remark=
    document.getElementById("remark")
      .value.trim();

  const trackingNumber=
    firstValue(
      transactionRows,
      ["tracking_number"]
    );

  const orderNo=
    firstValue(
      transactionRows,
      ["order_no"]
    );

  let itemsHtml="";

  transactionRows.forEach(row=>{

    itemsHtml+=`
      <tr>
        <td>
          <span class="item-code">
            ${escapeHtml(row.item_code||"-")}
          </span>
        </td>

        <td>
          <span class="item-name">
            ${escapeHtml(row.item_name||"-")}
          </span>
        </td>

        <td>
          <span class="qty">
            ${escapeHtml(formatQty(row.qty))}
          </span>
        </td>
      </tr>
    `;
  });

  const compactClass=
    transactionRows.length>6
      ? "compact"
      : "";

  const label=
    document.getElementById("shippingLabel");

  label.innerHTML=`

    <!-- HEADER -->

    <div class="label-header">

      <div class="brand-area">

        <img
          id="labelLogo"
          class="logo"
          crossorigin="anonymous"
          src="https://res.cloudinary.com/dzgaej1wo/image/upload/v1787898744/ULOGO_CLEAR_800_iyninb.png"
          alt="UNIMERCE"
        >

        <div class="warehouse">
          ${escapeHtml(warehouseText)}
        </div>

      </div>

      <div class="order-top">

        <div class="label-caption">
          ORDER NO.
        </div>

        <div class="order-number-top">
          ${escapeHtml(orderNo||"-")}
        </div>

      </div>

    </div>


    <!-- TRACKING -->

/* =========================================================
   BARCODE
   ========================================================= */

function generateBarcodes(){

  const tracking=
    firstValue(
      transactionRows,
      ["tracking_number"]
    );

  if(
    tracking &&
    document.getElementById("trackingBarcode")
  ){

    try{

      JsBarcode(
        "#trackingBarcode",
        tracking,
        {
          format:"CODE128",
          width:1.25,
          height:30,
          displayValue:false,
          margin:1,
          background:"#ffffff",
          lineColor:"#111827"
        }
      );

    }catch(error){

      console.warn(
        "Tracking barcode error:",
        error
      );
    }
  }
}

/* =========================================================
   QR CODE
   ========================================================= */

function generateTrackingQR(){

  const tracking=
    firstValue(
      transactionRows,
      ["tracking_number"]
    );

  const qrContainer=
    document.getElementById("trackingQr");

  if(!qrContainer){
    return;
  }

  qrContainer.innerHTML="";

  if(!tracking){
    return;
  }

  try{

    new QRCode(
      qrContainer,
      {
        text:tracking,
        width:84,
        height:84,
        colorDark:"#111827",
        colorLight:"#ffffff",
        correctLevel:QRCode.CorrectLevel.M
      }
    );

  }catch(error){

    console.warn(
      "QR code error:",
      error
    );
  }
}

/* =========================================================
   CAPTURE
   ========================================================= */

async function captureLabel(scale=3){

  const label=
    document.getElementById("shippingLabel");

  await document.fonts.ready;

  /*
    รอ logo / QR / barcode render ให้เสร็จ
    ก่อน html2canvas
  */
  await new Promise(
    resolve=>setTimeout(resolve,300)
  );

  return await html2canvas(
    label,
    {
      scale:scale,

      useCORS:true,

      allowTaint:false,

      backgroundColor:"#ffffff",

      logging:false,

      /*
        ช่วยให้ canvas ใช้ขนาดตาม element จริง
      */
      imageTimeout:15000
    }
  );
}

/* =========================================================
   SAVE
   ========================================================= */

function saveBlob(blob,filename){

  const url=
    URL.createObjectURL(blob);

  const link=
    document.createElement("a");

  link.href=url;
  link.download=filename;

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
}

/* =========================================================
   JPEG
   ========================================================= */

async function generateJPEG(){

  try{

    showStatus(
      "กำลังสร้าง JPEG..."
    );

    const canvas=
      await captureLabel(3);

    let quality=.9;

    let dataUrl=
      canvas.toDataURL(
        "image/jpeg",
        quality
      );

    while(
      dataUrl.length>
      200*1024*1.37 &&
      quality>.55
    ){

      quality-=.03;

      dataUrl=
        canvas.toDataURL(
          "image/jpeg",
          quality
        );
    }

    const blob=
      await fetch(dataUrl)
        .then(r=>r.blob());

    saveBlob(
      blob,
      `UNIMERCE_${invoiceNo}.jpg`
    );

    showStatus(
      `สร้าง JPEG แล้ว ขนาด ${Math.round(blob.size/1024)} KB`
    );

    setTimeout(
      hideStatus,
      2000
    );

  }catch(error){

    console.error(
      "JPEG Error:",
      error
    );

    showStatus(
      `สร้าง JPEG ไม่สำเร็จ: ${error.message}`,
      true
    );
  }
}

/* =========================================================
   PDF
   ========================================================= */

async function generatePDF(){

  try{

    showStatus(
      "กำลังสร้าง PDF..."
    );

    const canvas=
      await captureLabel(3);

    const {jsPDF}=
      window.jspdf;

    let quality=.9;

    let imageData=
      canvas.toDataURL(
        "image/jpeg",
        quality
      );

    let pdf=
      new jsPDF(
        {
          orientation:"portrait",
          unit:"mm",
          format:[100,150],
          compress:true
        }
      );

    pdf.addImage(
      imageData,
      "JPEG",
      0,
      0,
      100,
      150,
      undefined,
      "FAST"
    );

    let blob=
      pdf.output("blob");

    while(
      blob.size>200*1024 &&
      quality>.55
    ){

      quality-=.03;

      imageData=
        canvas.toDataURL(
          "image/jpeg",
          quality
        );

      pdf=
        new jsPDF(
          {
            orientation:"portrait",
            unit:"mm",
            format:[100,150],
            compress:true
          }
        );

      pdf.addImage(
        imageData,
        "JPEG",
        0,
        0,
        100,
        150,
        undefined,
        "FAST"
      );

      blob=
        pdf.output("blob");
    }

    saveBlob(
      blob,
      `UNIMERCE_${invoiceNo}.pdf`
    );

    const sizeKB=
      Math.round(blob.size/1024);

    showStatus(
      `สร้าง PDF แล้ว ขนาด ${sizeKB} KB`
    );

    setTimeout(
      hideStatus,
      2500
    );

  }catch(error){

    console.error(
      "PDF Error:",
      error
    );

    showStatus(
      `สร้าง PDF ไม่สำเร็จ: ${error.message}`,
      true
    );
  }
}
