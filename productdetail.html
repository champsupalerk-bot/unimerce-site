  <!-- =========================================================
       CORE CSS
  ========================================================== -->

  <style>
    /* ==========================================
       CORE DESIGN SYSTEM
    ========================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Kanit", Arial, sans-serif;
    }

    body {
      background: #ffffff;
      color: #1a1a1a;
      overflow-x: hidden;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      padding-top: 80px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px 16px 80px;
    }

    /* ==========================================
       BREADCRUMB
    ========================================== */

    .breadcrumb {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
      display: block !important;
    }

    .breadcrumb a {
      color: #888;
      text-decoration: none;
      transition: color 0.2s;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
      color: #2f5ea8;
    }

    /* ==========================================
       MAIN PRODUCT GRID
    ========================================== */

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 40px;
    }

    /* ==========================================
       IMAGE GALLERY
    ========================================== */

    .image-gallery {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .main-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #eee;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .thumb-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .thumb-box {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #eee;
      cursor: pointer;
      flex-shrink: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-box.active {
      border-color: #2f5ea8;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ==========================================
       INFO ZONE
    ========================================== */

    .info-zone {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
    }

    .product-name {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 16px;
      color: #111;
      text-align: left;
    }

    /* ==========================================
       PRODUCT META TABLE
    ========================================== */

    .meta-table {
      width: 100%;
      max-width: 380px;
      border-collapse: collapse;
      margin-bottom: 24px;
    }

    .meta-table td {
      padding: 8px 0;
      font-size: 18px;
      border-bottom: 1px dashed #eee;
      vertical-align: middle;
    }

    .meta-table td.lbl {
      color: #777;
      width: 120px;
    }

    .meta-table td.val {
      color: #111;
      font-weight: 500;
    }

    /* ==========================================
       PRICE BOX
    ========================================== */

    .price-box-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafafa;
      padding: 12px 18px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 20px;
    }

    .price-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .price-old {
      font-size: 13px;
      color: #999;
      text-decoration: line-through;
    }

    .price-new {
      font-size: 24px;
      font-weight: 700;
      color: #111;
    }

    /* ==========================================
       MOBILE DYNAMIC BLOCK
    ========================================== */

    .mobile-dynamic-block {
      display: none;
    }

    /* ==========================================
       QUANTITY
    ========================================== */

    .qty-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .qty-label {
      font-size: 13px;
      color: #666;
    }

    .qty-control {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      height: 34px;
    }

    .qty-btn {
      width: 34px;
      height: 100%;
      background: #fff;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover {
      background: #f5f5f5;
    }

    .qty-input {
      width: 46px;
      height: 100%;
      text-align: center;
      border: none;
      border-left: 1px solid #ddd;
      border-right: 1px solid #ddd;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      background: #fff;
      color: #111;
      padding: 0;
    }

    /* ==========================================
       ACTION BUTTONS
    ========================================== */

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }

    .btn-primary {
      background: #2f5ea8;
      color: #fff;
      border: 1px solid #2f5ea8;
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }

    .btn-primary:hover {
      background: #fff;
      color: #2f5ea8;
    }

    .btn-cart {
      background: #ffffff;
      color: #2f5ea8;
      border: 1px solid #2f5ea8;
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }

    .btn-cart:hover {
      background: #f4f7fc;
    }

    /* ==========================================
       SHOPEE STYLE HEART
    ========================================== */

    .shopee-heart-wrapper {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease;
      padding: 4px 8px;
    }

    .shopee-heart-wrapper:active {
      transform: scale(0.9);
    }

    .shopee-heart-icon {
      font-size: 26px;
      line-height: 1;
      color: #e2e8f0;
      transition: color 0.2s ease;
    }

    .shopee-heart-wrapper.liked .shopee-heart-icon {
      color: #ff4d4f;
    }

    .shopee-like-counter {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
      font-weight: 500;
    }

    /* ==========================================
       PRODUCT DETAIL
    ========================================== */

    .detail-sections {
      display: flex;
      flex-direction: column;
      gap: 32px;
      border-top: 1px solid #eee;
      padding-top: 32px;
      margin-bottom: 60px;
    }

    .sec-block h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 14px;
      color: #111;
      text-transform: uppercase;
      border-left: 3px solid #2f5ea8;
      padding-left: 10px;
    }

    .sec-block .body-text {
      font-size: 14.5px;
      color: #333;
      line-height: 1.8;
      white-space: pre-line;
    }

    /* ==========================================
       FOOTER CONTACT
    ========================================== */

    .contact-footer-bar {
      border-top: 1px solid #eee;
      padding-top: 40px;
      text-align: center;
    }

    .contact-footer-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #666;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .clean-email-link {
      display: inline-block;
      color: #2f5ea8;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .clean-email-link:hover {
      color: #1a3e75;
      text-decoration: underline;
    }

    /* ==========================================
       ORDER MODAL
    ========================================== */

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      animation: popUp 0.25s ease;
    }

    @keyframes popUp {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 10px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: #111;
    }

    .modal-close {
      font-size: 22px;
      cursor: pointer;
      color: #aaa;
      border: none;
      background: none;
      line-height: 1;
    }

    .modal-instruction-text {
      font-size: 13px;
      color: #444;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .email-row-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8f9fa;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      border: 1px solid #eee;
    }

    .btn-inline-copy {
      background: #fff;
      border: 1px solid #ddd;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      color: #2f5ea8;
      font-weight: 500;
    }

    .btn-inline-copy:hover {
      background: #f5f5f5;
      border-color: #2f5ea8;
    }

    .copy-area-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .copy-area-header-flex span {
      font-size: 13px;
      font-weight: 500;
      color: #111;
    }

    .copy-area {
      background: #f5f5f5;
      border: 1px solid #eee;
      padding: 12px;
      border-radius: 8px;
      font-size: 12.5px;
      color: #333;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      margin-bottom: 16px;
      max-height: 140px;
      overflow-y: auto;
    }

    /* ==========================================
       BANK PAYMENT
    ========================================== */

    .bank-payment-box {
      background: #f4fbf7;
      border: 1px solid #b7ebd0;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .bank-payment-box .bank-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #00a651;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bank-payment-box .bank-title::before {
      content: "▪";
      font-size: 14px;
    }

    .bank-detail-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      color: #1a1a1a;
    }

    .bank-detail-flex .kbank-btn-copy {
      color: #00a651;
      border-color: #b7ebd0;
    }

    .bank-detail-flex .kbank-btn-copy:hover {
      background: #00a651;
      color: #fff;
      border-color: #00a651;
    }

    .toast-msg {
      font-size: 12px;
      color: #00a651;
      text-align: center;
      margin-top: 8px;
      min-height: 18px;
      font-weight: 500;
    }

    /* ==========================================
       STATUS
    ========================================== */

    .status-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      text-align: center;
    }

    .loading-text {
      font-size: 15px;
      color: #888;
    }

    .error-text {
      font-size: 15px;
      color: #ff4d4f;
      margin-bottom: 12px;
    }

    .back-btn {
      display: inline-block;
      padding: 8px 18px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
    }

    /* ==========================================
       BARCODE BUTTON
    ========================================== */

    .btn-barcode-trigger {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      margin-left: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      border-radius: 6px;
      transition: background 0.1s;
    }

    .btn-barcode-trigger:hover {
      background: #e8e8e8;
    }

    /* ==========================================
       HIDDEN STICKER
    ========================================== */

    #hiddenStickerWrapper {
      position: absolute;
      left: -9999px;
      top: -9999px;
    }

    .actual-sticker-target {
      width: 300px;
      height: 200px;
      background: #ffffff;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      font-family: Arial, sans-serif;
      color: #000000;
      padding: 12px 14px;
    }

    .sticker-p-name {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.25;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sticker-barcode-area {
      text-align: center;
      margin: auto 0;
      width: 100%;
    }

    .sticker-barcode-area svg {
      width: 100%;
      max-height: 85px;
    }

    .sticker-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px;
      font-weight: bold;
    }

    .sticker-web-url {
      color: #111;
    }

    .sticker-location-field {
      color: #555;
    }

    /* ==========================================
       BARCODE MODAL
    ========================================== */

    .barcode-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .barcode-modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .barcode-modal-title {
      margin: 0 0 12px 0;
      font-size: 16px;
      font-weight: bold;
      color: #2f5ea8;
    }

    .btn-cancel-modal {
      background: none;
      border: none;
      color: #666;
      font-size: 15px;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 5px;
      padding: 10px;
    }

    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 768px) {

      body {
        font-size: 16px !important;
        line-height: 1.8;
        padding-top: 75px;
      }

      .breadcrumb {
        margin-bottom: 12px;
      }

      .main-grid {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }

      .info-zone {
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      .info-zone .product-name,
      .info-zone .meta-table,
      .info-zone .price-box-wrapper {
        display: none;
      }

      .mobile-dynamic-block {
        display: flex;
        flex-direction: column;
        width: 100%;
        margin-top: 8px;
      }

      .mobile-dynamic-block .product-name {
        display: block !important;
        font-size: 22px !important;
        font-weight: 600;
        line-height: 1.3;
        margin-bottom: 8px;
      }

      .mobile-price-heart-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fafafa;
        padding: 8px 14px;
        border-radius: 10px;
        margin-bottom: 12px;
        width: 100%;
      }

      .mobile-price-left .price-old {
        font-size: 11px;
      }

      .mobile-price-left .price-new {
        font-size: 20px;
      }

      .shopee-heart-icon {
        font-size: 22px;
      }

      .qty-row {
        margin-bottom: 14px;
      }

      .mobile-table-placeholder {
        display: block !important;
        margin-top: 20px;
        width: 100%;
      }

      .mobile-table-placeholder .meta-table {
        display: table !important;
        max-width: 100%;
        margin-bottom: 0;
      }

      .btn-group {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
        margin-top: 2px;
      }

      .btn-primary,
      .btn-cart {
        padding: 10px 8px;
        font-size: 13.5px;
        border-radius: 8px;
      }

      .sec-block h2 {
        font-size: 18px !important;
        margin-bottom: 10px;
      }

      .sec-block .body-text {
        font-size: 18px !important;
        line-height: 1.85;
        color: #222222;
      }

      .modal-box {
        max-height: 90vh;
        overflow-y: auto;
      }
    }
  </style>

  <!-- =========================
       ANALYTICS
  ========================== -->

  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-7LRV59ZF3R"
  ></script>

  <script src="/analytics.js"></script>

  <!-- =========================
       BARCODE LIBRARIES
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="/barcode-label-engine.js"></script>

</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <div id="header-placeholder"></div>

  <!-- =========================
       MAIN CONTENT
  ========================== -->

  <main class="container" id="main-content">

    <div class="status-container">
      <div class="loading-text">
        กำลังเรียกดูข้อมูลสินค้า...
      </div>
    </div>

  </main>

  <!-- =========================
       FOOTER
  ========================== -->

  <div id="footer-placeholder"></div>

  <!-- =========================================================
       HIDDEN BARCODE STICKER
  ========================================================== -->

  <div id="hiddenStickerWrapper">

    <div id="stickerTarget" class="actual-sticker-target">

      <div id="lblProductName" class="sticker-p-name"></div>

      <div class="sticker-barcode-area">
        <svg id="barcodeSvgCanvas"></svg>
      </div>

      <div class="sticker-footer-row">

        <span class="sticker-web-url">
          www.unimercegroup.com
        </span>

        <span
          id="lblLocationField"
          class="sticker-location-field"
        ></span>

      </div>

    </div>

  </div>

  <!-- =========================================================
       BARCODE MODAL
  ========================================================== -->

  <div
    id="barcodeModal"
    class="barcode-modal-overlay"
    onclick="closeBarcodeModalOnOutsideClick(event)"
  >

    <div class="barcode-modal-content">

      <div class="barcode-modal-title">
        แตะค้างที่ป้ายเพื่อบันทึก
      </div>

      <div
        style="
          margin: 15px 0 20px 0;
          display: flex;
          justify-content: center;
        "
