<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UERP - Sales Report</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ขยายสีให้รองรับ Class สี Google ใน uerpheader.html
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'google-blue': '#1a73e8',
                        'google-gray': '#5f6368',
                        'google-border': '#dadce0',
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK (v2) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Global Header/Layout Script -->
    <script src="js/layoutuerp.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Header Placeholder (จะถูกเติมด้วย uerpheader.html แบบ Dynamic) -->
    <div id="headerContainer"></div>

    <!-- Container จำกัดความกว้างไม่เกิน 1000px -->
    <main class="max-w-[1000px] mx-auto p-3 sm:p-6">
        
        <!-- Controls Header Panel -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-3 sm:p-4 mb-4 space-y-3">
            
            <!-- Row 1: Period Picker, Metric Dropdown & Refresh Button -->
            <div class="flex items-center justify-between gap-2">
                
                <!-- Dropdown เลือกสลับ Metric (Qty / Sales Amt) -->
                <div class="flex items-center gap-1.5 flex-1 min-w-0">
                    <label class="text-[10px] sm:text-xs font-semibold text-slate-500 whitespace-nowrap">มุมมอง:</label>
                    <select id="metricSelector" class="bg-slate-50 border border-slate-200 text-slate-800 text-[10px] sm:text-xs font-bold rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 block w-full p-2 cursor-pointer transition truncate">
                        <option value="qty" selected>จำนวนชิ้น (QTY)</option>
                        <option value="customer_net_payment_amt">ยอดขายรวม (Sales Amt - ฿)</option>
                    </select>
                </div>

                <!-- Period Picker & Refresh Button -->
                <div class="flex items-center gap-1.5 flex-1 min-w-0 justify-end">
                    <label class="text-[10px] sm:text-xs font-semibold text-slate-500 whitespace-nowrap">ช่วงเวลา:</label>
                    <select id="periodSelector" class="bg-slate-50 border border-slate-200 text-slate-800 text-[10px] sm:text-xs font-bold rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 block w-full sm:w-auto p-2 cursor-pointer transition truncate">
                        <option value="this_month" selected>เดือนนี้</option>
                        <option value="last_month">เดือนที่แล้ว</option>
                        <option value="last_3_months">3 เดือนที่แล้ว</option>
                        <option value="this_year">ปีนี้</option>
                        <option value="last_year">ปีที่แล้ว</option>
                    </select>
                    <!-- ปุ่ม Manual Refresh Cache -->
                    <button onclick="forceRefreshData()" title="รีเฟรชข้อมูลจากเซิร์ฟเวอร์" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 text-xs px-2.5 py-2 rounded-lg transition flex items-center justify-center shrink-0">
                        <i id="refreshIcon" class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>

            <!-- Row 2: Search Bar & Mini Logger Status -->
            <div class="flex flex-col sm:flex-row gap-2 items-center justify-between">
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="ค้นหา รหัสสินค้า หรือ ชื่อสินค้า..." 
                        class="bg-slate-50 border border-slate-200 text-slate-900 text-xs rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 block w-full pl-8 p-2.5 transition placeholder:text-slate-400">
                </div>
                <!-- Mini Logger Display -->
                <div id="miniLogger" class="text-[11px] text-slate-400 italic whitespace-nowrap w-full sm:w-auto text-left sm:text-right px-1">
                    พร้อมใช้งาน (Cache)
                </div>
            </div>

        </div>

        <!-- Status Panel -->
        <div id="statusIndicator" class="hidden p-3 bg-blue-50/80 rounded-xl border border-blue-100 flex items-center gap-3 mb-4 backdrop-blur-sm">
            <i class="fa-solid fa-circle-notch animate-spin text-blue-600"></i>
            <span id="statusText" class="text-xs font-medium text-blue-700">กำลังดึงข้อมูล...</span>
        </div>

        <!-- Report Table Box -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
            
            <!-- Summary Bar -->
            <div class="bg-slate-900 text-white p-3 px-4 flex justify-between items-center text-xs font-semibold tracking-wide">
                <span id="summaryTitle">สรุปยอดขาย</span>
                <span id="summaryTotal" class="text-amber-400 font-bold bg-slate-800 px-2.5 py-1 rounded-md border border-slate-700">รวมทั้งสิ้น: 0</span>
            </div>

            <!-- Fixed Height Inner Scroll Container -->
            <div class="max-h-[60vh] sm:max-h-[65vh] overflow-y-auto overflow-x-auto relative divide-y divide-slate-100">
                <table class="w-full text-left text-xs text-slate-600 border-collapse">
                    <thead id="tableHeader" class="bg-slate-50 text-slate-700 font-bold uppercase border-b border-slate-200 cursor-pointer select-none sticky top-0 z-10 shadow-sm">
                        <!-- Dynamic Header -->
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100 bg-white">
                        <!-- Dynamic Data Rows -->
                    </tbody>
                </table>
            </div>

        </div>

    </main>

    <script>
        // Supabase API Credentials
        const supabaseUrl = "https://xygdmszernmircmbqwke.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5Z2Rtc3plcm5taXJjbWJxd2tlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NTY5NTAsImV4cCI6MjA5NzIzMjk1MH0.Qcq5h2TignXwhsyOe8IYcMYvlayyTjH66tTiPznVOOY";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // State Management
        let rawTransactionsData = [];
        let processedData = [];
        let currentSortColumn = 'metric_val'; 
        let currentSortOrder = 'DESC';        

        document.addEventListener('DOMContentLoaded', () => {
            loadHeader();
            initApp();
        });

        // ดึง uerpheader.html เข้ามาใส่ใน #headerContainer
        async function loadHeader() {
            try {
                // ปรับพาธของไฟล์ uerpheader.html ตามโครงสร้างไดเรกทอรีจริง
                const res = await fetch('uerpheader.html');
                if (!res.ok) throw new Error('Header load failed');
                const html = await res.text();
                
                const headerContainer = document.getElementById('headerContainer');
                headerContainer.innerHTML = html;

                // ไฮไลต์ Tab "Sales"
                const salesTab = headerContainer.querySelector('[data-page="sales"]');
                if (salesTab) {
                    salesTab.classList.add('chrome-tab-active');
                }

                // เรียกฟังก์ชันจาก layoutuerp.js หากต้องการ Re-init
                if (typeof window.initUerpLayout === 'function') {
                    window.__uerpLayoutInitialized = false; // รีเซ็ตสถานะเพื่อให้ init ซ้ำได้
                    window.initUerpLayout();
                }
            } catch (err) {
                console.warn('Cannot load header dynamically:', err);
            }
        }

        function initApp() {
            document.getElementById('periodSelector').addEventListener('change', () => loadSalesData(false));
            document.getElementById('metricSelector').addEventListener('change', renderReport);
            document.getElementById('searchInput').addEventListener('input', renderReport);
            window.addEventListener('resize', renderReport);

            loadSalesData(false);
        }

        // อัปเดต Mini Logger
        function updateLog(msg) {
            const logger = document.getElementById('miniLogger');
            if (logger) logger.innerText = msg;
        }

        // ฟังก์ชันกด Refresh แมนนวล
        function forceRefreshData() {
            const period = document.getElementById('periodSelector').value;
            localStorage.removeItem(`uerp_sales_cache_${period}`);
            localStorage.removeItem(`uerp_sales_time_${period}`);
            loadSalesData(true);
        }

        // ดึงข้อมูลจาก Supabase แบบแบ่งบล็อกทีละ 1,000 แถว พร้อม Cache วันละครั้ง
        async function loadSalesData(isManualRefresh = false) {
            const period = document.getElementById('periodSelector').value;
            const cacheKey = `uerp_sales_cache_${period}`;
            const timeKey = `uerp_sales_time_${period}`;
            
            const cachedData = localStorage.getItem(cacheKey);
            const cachedTime = localStorage.getItem(timeKey);
            const nowTime = new Date().getTime();
            const oneDayMs = 24 * 60 * 60 * 1000; // 1 วัน

            // ตรวจสอบ Cache (หากยังมีอายุไม่เกิน 1 วัน และไม่ได้กดปุ่มรีเฟรช ให้ใช้ Cache)
            if (!isManualRefresh && cachedData && cachedTime && (nowTime - Number(cachedTime) < oneDayMs)) {
                rawTransactionsData = JSON.parse(cachedData);
                updateLog(`โหลดจาก Cache สำเร็จ (${rawTransactionsData.length.toLocaleString()} รายการ)`);
                aggregateData();
                renderReport();
                return;
            }

            const statusIndicator = document.getElementById('statusIndicator');
            statusIndicator.classList.remove('hidden');
            statusIndicator.className = "p-3 bg-blue-50/80 rounded-xl border border-blue-100 flex items-center gap-3 mb-4 backdrop-blur-sm";
            statusIndicator.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin text-blue-600"></i><span id="statusText" class="text-xs font-medium text-blue-700">กำลังเชื่อมต่อเซิร์ฟเวอร์...</span>`;

            try {
                const dateRange = calculateDateRange(period);
                let allRows = [];
                let page = 0;
                let pageSize = 1000;
                let fetchMore = true;

                updateLog(`เริ่มดึงข้อมูลจาก Supabase...`);

                while (fetchMore) {
                    const from = page * pageSize;
                    const to = from + pageSize - 1;

                    updateLog(`กำลังดึงชุดข้อมูลแถวที่ ${from.toLocaleString()} ถึง ${to.toLocaleString()}...`);

                    const { data, error } = await supabaseClient
                        .from('transactions')
                        .select('item_code, item_name, qty, customer_net_payment_amt, date')
                        .gte('date', dateRange.start)
                        .lte('date', dateRange.end)
                        .range(from, to);

                    if (error) throw error;

                    if (data && data.length > 0) {
                        allRows = allRows.concat(data);
                        page++;
                        // หน่วงเวลาเล็กน้อย 150ms เพื่อไม่ให้ยิงรัวชน Rate Limit ของ Supabase
                        await new Promise(resolve => setTimeout(resolve, 150));
                        
                        if (data.length < pageSize) {
                            fetchMore = false; // ถ้าดึงมาไม่เต็มหน้า แสดงว่าหมดแล้ว
                        }
                    } else {
                        fetchMore = false;
                    }
                }

                rawTransactionsData = allRows;

                // บันทึกลง Cache
                localStorage.setItem(cacheKey, JSON.stringify(rawTransactionsData));
                localStorage.setItem(timeKey, nowTime.toString());

                statusIndicator.classList.add('hidden');
                updateLog(`ดึงข้อมูลครบถ้วน: ${rawTransactionsData.length.toLocaleString()} รายการ`);

                aggregateData();
                renderReport();

            } catch (err) {
                console.error("Error loading sales data:", err);
                statusIndicator.className = "p-3 bg-red-50/80 rounded-xl border border-red-100 flex items-center gap-2 mb-4 text-red-700 text-xs font-medium";
                statusIndicator.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-500"></i> เกิดข้อผิดพลาด: ${err.message}`;
                updateLog(`เกิดข้อผิดพลาดในการโหลดข้อมูล`);
            }
        }

        // รวมยอดข้อมูล Group By สินค้า
        function aggregateData() {
            const metric = document.getElementById('metricSelector').value;
            const itemMap = {};

            rawTransactionsData.forEach(item => {
                const code = item.item_code || 'UNSPECIFIED';
                const name = item.item_name || 'ไม่ระบุชื่อสินค้า';
                const key = `${code}___${name}`;

                if (!itemMap[key]) {
                    itemMap[key] = {
                        item_code: code,
                        item_name: name,
                        qty: 0,
                        customer_net_payment_amt: 0,
                        metric_val: 0
                    };
                }

                const qty = Number(item.qty || 0);
                const sales = Number(item.customer_net_payment_amt || 0);

                itemMap[key].qty += qty;
                itemMap[key].customer_net_payment_amt += sales;
                itemMap[key].metric_val += (metric === 'qty') ? qty : sales;
            });

            processedData = Object.values(itemMap);
        }

        // เรนเดอร์ส่วนตารางและหัวตาราง
        function renderReport() {
            aggregateData();

            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const metric = document.getElementById('metricSelector').value;
            const isMobile = window.innerWidth < 768;

            let filteredData = processedData;
            if (searchTerm) {
                filteredData = processedData.filter(item => 
                    item.item_code.toLowerCase().includes(searchTerm) || 
                    item.item_name.toLowerCase().includes(searchTerm)
                );
            }

            filteredData.sort((a, b) => {
                let valA = a[currentSortColumn];
                let valB = b[currentSortColumn];

                if (typeof valA === 'string') {
                    return currentSortOrder === 'ASC' 
                        ? valA.localeCompare(valB, 'th') 
                        : valB.localeCompare(valA, 'th');
                } else {
                    return currentSortOrder === 'ASC' ? valA - valB : valB - valA;
                }
            });

            renderHeader(isMobile, metric);
            renderBody(filteredData, isMobile, metric);
        }

        function renderHeader(isMobile, metric) {
            const header = document.getElementById('tableHeader');
            const metricLabel = metric === 'qty' ? 'จำนวน (ชิ้น)' : 'ยอดขาย (บาท)';

            if (isMobile) {
                header.innerHTML = `
                    <tr>
                        <th onclick="sortTable('item_code')" class="p-3 bg-slate-50 w-1/4">รหัส ${getSortIcon('item_code')}</th>
                        <th onclick="sortTable('item_name')" class="p-3 bg-slate-50 w-1/2">ชื่อสินค้า ${getSortIcon('item_name')}</th>
                        <th onclick="sortTable('metric_val')" class="p-3 bg-slate-50 w-1/4 text-right">${metricLabel} ${getSortIcon('metric_val')}</th>
                    </tr>
                `;
            } else {
                header.innerHTML = `
                    <tr>
                        <th onclick="sortTable('item_code')" class="p-3 bg-slate-50 w-2/12">รหัสสินค้า ${getSortIcon('item_code')}</th>
                        <th onclick="sortTable('item_name')" class="p-3 bg-slate-50 w-5/12">ชื่อสินค้า ${getSortIcon('item_name')}</th>
                        <th onclick="sortTable('qty')" class="p-3 bg-slate-50 w-2/12 text-right">จำนวน (ชิ้น) ${getSortIcon('qty')}</th>
                        <th onclick="sortTable('customer_net_payment_amt')" class="p-3 bg-slate-50 w-3/12 text-right">ยอดขายรวม (บาท) ${getSortIcon('customer_net_payment_amt')}</th>
                    </tr>
                `;
            }
        }

        function renderBody(data, isMobile, metric) {
            const body = document.getElementById('tableBody');
            const summaryTitle = document.getElementById('summaryTitle');
            const summaryTotal = document.getElementById('summaryTotal');

            if (data.length === 0) {
                body.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400">ไม่พบข้อมูลตรงตามเงื่อนไข</td></tr>`;
                summaryTotal.innerText = `รวมทั้งสิ้น: 0`;
                return;
            }

            let totalQtySum = 0;
            let totalSalesSum = 0;

            let html = '';
            data.forEach(item => {
                totalQtySum += item.qty || 0;
                totalSalesSum += item.customer_net_payment_amt || 0;

                if (isMobile) {
                    const displayVal = metric === 'qty' 
                        ? `${item.qty.toLocaleString()} ชิ้น`
                        : `฿${item.customer_net_payment_amt.toLocaleString('th-TH', {minimumFractionDigits: 0})}`;

                    html += `
                        <tr class="hover:bg-slate-50/80 transition-colors border-b border-slate-100">
                            <td class="p-3 font-mono text-[11px] text-slate-500">${escapeHtml(item.item_code)}</td>
                            <td class="p-3 font-medium text-slate-800 break-words">${escapeHtml(item.item_name)}</td>
                            <td class="p-3 text-right font-bold text-blue-600 whitespace-nowrap">${displayVal}</td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr class="hover:bg-slate-50/80 transition-colors border-b border-slate-100">
                            <td class="p-3 font-mono text-slate-500">${escapeHtml(item.item_code)}</td>
                            <td class="p-3 font-semibold text-slate-800">${escapeHtml(item.item_name)}</td>
                            <td class="p-3 text-right font-semibold text-slate-700">${item.qty.toLocaleString()}</td>
                            <td class="p-3 text-right font-bold text-blue-600">฿${item.customer_net_payment_amt.toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                        </tr>
                    `;
                }
            });

            body.innerHTML = html;

            summaryTitle.innerText = `จำนวนรายการสินค้าทั้งหมด: ${data.length} รายการ`;
            summaryTotal.innerText = metric === 'qty' 
                ? `ยอดรวม: ${totalQtySum.toLocaleString()} ชิ้น`
                : `ยอดขายรวม: ฿${totalSalesSum.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
        }

        function sortTable(column) {
            if (currentSortColumn === column) {
                currentSortOrder = currentSortOrder === 'DESC' ? 'ASC' : 'DESC';
            } else {
                currentSortColumn = column;
                currentSortOrder = 'DESC';
            }
            renderReport();
        }

        function getSortIcon(column) {
            if (currentSortColumn !== column) return '<i class="fa-solid fa-sort text-slate-300 ml-1"></i>';
            return currentSortOrder === 'DESC' 
                ? '<i class="fa-solid fa-sort-down text-blue-600 ml-1"></i>' 
                : '<i class="fa-solid fa-sort-up text-blue-600 ml-1"></i>';
        }

        function calculateDateRange(period) {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();

            let start, end;

            switch (period) {
                case 'this_month':
                    start = new Date(year, month, 1, 0, 0, 0, 0);
                    end = new Date(year, month + 1, 0, 23, 59, 59, 999);
                    break;

                case 'last_month':
                    start = new Date(year, month - 1, 1, 0, 0, 0, 0);
                    end = new Date(year, month, 0, 23, 59, 59, 999);
                    break;

                case 'last_3_months':
                    start = new Date(year, month - 2, 1, 0, 0, 0, 0);
                    end = new Date(year, month + 1, 0, 23, 59, 59, 999);
                    break;

                case 'this_year':
                    start = new Date(year, 0, 1, 0, 0, 0, 0);
                    end = new Date(year, 11, 31, 23, 59, 59, 999);
                    break;

                case 'last_year':
                    start = new Date(year - 1, 0, 1, 0, 0, 0, 0);
                    end = new Date(year - 1, 11, 31, 23, 59, 59, 999);
                    break;
            }

            return {
                start: start.toISOString(),
                end: end.toISOString()
            };
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
